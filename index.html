<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOGER ATENCIO SPORT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#06140d;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#0b5d2a,#063b1b);
  padding:20px 12px;
  text-align:center;
  border-bottom:2px solid #20c463;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#b9ffd0;
  font-size:13px;
}

.tabs{
  display:flex;
  gap:6px;
  padding:10px;
  background:#041009;
  position:sticky;
  top:0;
  z-index:20;
}

.tab{
  flex:1;
  border:1px solid #176d36;
  background:#0b2616;
  color:#fff;
  padding:12px 5px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#159447;
  border-color:#39e477;
}

.status{
  margin:10px;
  padding:10px;
  border-radius:8px;
  background:#102519;
  border:1px solid #1b6334;
  text-align:center;
  font-size:13px;
}

.container{
  padding:0 10px 30px;
}

.loading{
  text-align:center;
  padding:35px 15px;
  color:#b9ffd0;
}

.error{
  margin:15px 0;
  padding:15px;
  background:#3a1010;
  border:1px solid #a93232;
  border-radius:10px;
  text-align:center;
}

.retry{
  margin-top:10px;
  background:#159447;
  color:#fff;
  border:0;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
}

.country{
  margin-top:14px;
  border:1px solid #14552d;
  border-radius:10px;
  overflow:hidden;
  background:#081b10;
}

.country-title{
  padding:13px;
  background:#0d3b1d;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.league{
  margin:8px;
  border:1px solid #1a6032;
  border-radius:9px;
  overflow:hidden;
  background:#07140c;
}

.league-title{
  padding:11px;
  background:#0d2816;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.league-name{
  font-weight:bold;
}

.league-count{
  color:#9effb8;
  font-size:12px;
}

.matches{
  padding:5px;
}

.match{
  background:#0c2113;
  border:1px solid #174d29;
  border-radius:8px;
  margin:6px 0;
  padding:10px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:#9ad9ac;
  margin-bottom:8px;
}

.live{
  color:#ff5555;
  font-weight:bold;
}

.teams{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  align-items:center;
  gap:5px;
}

.team{
  text-align:center;
  font-size:13px;
  font-weight:bold;
}

.team img{
  width:32px;
  height:32px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px;
}

.score{
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.pred-btn{
  width:100%;
  margin-top:9px;
  padding:9px;
  border:1px solid #24884a;
  border-radius:7px;
  background:#0e4925;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.prediction{
  display:none;
  margin-top:9px;
  padding:10px;
  background:#06150b;
  border:1px solid #1d6837;
  border-radius:8px;
}

.prediction.show{
  display:block;
}

.pred-title{
  font-weight:bold;
  color:#7dff9d;
  margin-bottom:8px;
}

.pred-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.pred-item{
  padding:8px 4px;
  text-align:center;
  border-radius:6px;
  background:#102719;
  font-size:12px;
}

.percent{
  display:block;
  font-size:16px;
  font-weight:bold;
  margin-top:3px;
}

.green{
  color:#35ed70;
}

.yellow{
  color:#ffe45c;
}

.red{
  color:#ff6868;
}

.note{
  margin-top:8px;
  color:#a8cdb2;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#9bb8a3;
}

.small{
  font-size:11px;
  color:#8fb39a;
}

@media(max-width:500px){
  header h1{
    font-size:22px;
  }

  .teams{
    grid-template-columns:1fr 48px 1fr;
  }

  .team{
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="tabs">
  <button class="tab active" id="tabLive" onclick="cambiarSeccion('live')">🔴 EN VIVO</button>
  <button class="tab" id="tabToday" onclick="cambiarSeccion('today')">📅 HOY</button>
  <button class="tab" id="tabNext" onclick="cambiarSeccion('next')">⏭️ PRÓXIMOS</button>
</div>

<div id="status" class="status">
  ⏳ Conectando con la API...
</div>

<div class="container">
  <div id="app">
    <div class="loading">
      ⚽ Cargando partidos...<br>
      <span class="small">Conectando con YOGER ATENCIO SPORT</span>
    </div>
  </div>
</div>

<script>
const ligasPrediccion = [
  "La Liga",
  "Copa del Rey",
  "Premier League",
  "Championship",
  "League One",
  "FA Cup",
  "Serie A",
  "Bundesliga",
  "2. Bundesliga",
  "Ligue 1",
  "UEFA Champions League",
  "UEFA Europa League",
  "UEFA Europa Conference League",
  "Brasileirão",
  "Copa Libertadores",
  "Copa Sudamericana",
  "Scottish Premiership",
  "Belgian Pro League",
  "Superliga",
  "Eliteserien",
  "Super League"
];

let datos = {
  live: [],
  today: [],
  next: []
};

let seccionActual = "live";
let cargando = false;

function escapeHTML(texto){
  if(texto === null || texto === undefined) return "";
  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function obtenerLiga(match){
  return match?.league?.name || "Otras ligas";
}

function obtenerPais(match){
  return match?.league?.country || "Internacional";
}

function nombreEquipo(team){
  return team?.name || "Equipo";
}

function logoEquipo(team){
  return team?.logo || "";
}

function horaPartido(match){
  const fecha = match?.fixture?.date;

  if(!fecha) return "--:--";

  try{
    return new Date(fecha).toLocaleTimeString("es-ES",{
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch(e){
    return "--:--";
  }
}

function estadoPartido(match){
  const status = match?.fixture?.status;

  if(status?.short === "NS"){
    return horaPartido(match);
  }

  if(status?.short === "HT"){
    return "DESCANSO";
  }

  if(status?.short === "FT"){
    return "FINAL";
  }

  if(status?.short === "PST"){
    return "APLAZADO";
  }

  if(status?.short === "CANC"){
    return "CANCELADO";
  }

  if(status?.elapsed){
    return status.elapsed + "'";
  }

  return horaPartido(match);
}

function esEnVivo(match){
  const s = match?.fixture?.status?.short;

  return [
    "1H","2H","HT","ET","BT",
    "P","LIVE"
  ].includes(s);
}

function colorPorcentaje(valor){
  if(valor === null || valor === undefined || valor === "") return "";

  const numero = parseFloat(String(valor).replace("%",""));

  if(isNaN(numero)) return "";

  if(numero >= 70) return "green";
  if(numero >= 50) return "yellow";

  return "red";
}

function mostrarPorcentaje(valor){
  if(valor === null || valor === undefined || valor === ""){
    return "—";
  }

  return String(valor).includes("%") ? String(valor) : String(valor) + "%";
}

function ordenarPartidos(lista){
  return [...lista].sort((a,b)=>{
    const da = new Date(a?.fixture?.date || 0).getTime();
    const db = new Date(b?.fixture?.date || 0).getTime();
    return da - db;
  });
}

function agrupar(lista){
  const paises = {};

  lista.forEach(match=>{
    const pais = obtenerPais(match);
    const liga = obtenerLiga(match);

    if(!paises[pais]){
      paises[pais] = {};
    }

    if(!paises[pais][liga]){
      paises[pais][liga] = [];
    }

    paises[pais][liga].push(match);
  });

  return paises;
}

function crearPartido(match){
  const home = match?.teams?.home || {};
  const away = match?.teams?.away || {};

  const live = esEnVivo(match);

  const homeScore = match?.goals?.home;
  const awayScore = match?.goals?.away;

  const scoreVisible =
    homeScore !== null &&
    homeScore !== undefined &&
    awayScore !== null &&
    awayScore !== undefined;

  const liga = obtenerLiga(match);

  const puedePrediccion = ligasPrediccion.some(
    nombre => liga.toLowerCase() === nombre.toLowerCase()
  );

  const id = match?.fixture?.id;

  let html = `
    <div class="match">

      <div class="match-top">
        <span class="${live ? "live" : ""}">
          ${live ? "🔴 EN VIVO" : "⚽ PARTIDO"}
        </span>

        <span>${escapeHTML(estadoPartido(match))}</span>
      </div>

      <div class="teams">

        <div class="team">
          ${
            logoEquipo(home)
            ? `<img src="${escapeHTML(logoEquipo(home))}" onerror="this.style.display='none'">`
            : ""
          }
          ${escapeHTML(nombreEquipo(home))}
        </div>

        <div class="score">
          ${
            scoreVisible
            ? `${homeScore} - ${awayScore}`
            : "VS"
          }
        </div>

        <div class="team">
          ${
            logoEquipo(away)
            ? `<img src="${escapeHTML(logoEquipo(away))}" onerror="this.style.display='none'">`
            : ""
          }
          ${escapeHTML(nombreEquipo(away))}
        </div>

      </div>
  `;

  if(puedePrediccion && id){
    html += `
      <button class="pred-btn"
        onclick="verPrediccion('${id}',this)">
        🔮 VER PREDICCIÓN
      </button>

      <div class="prediction" id="pred-${id}">
        <div class="pred-title">🔮 Predicción</div>
        <div class="small">Pulsa el botón para consultar los datos.</div>
      </div>
    `;
  }

  html += `</div>`;

  return html;
}

function crearHTML(lista){
  if(!lista || lista.length === 0){
    return `
      <div class="empty">
        ⚽ No hay partidos para mostrar en esta sección.
      </div>
    `;
  }

  const grupos = agrupar(ordenarPartidos(lista));

  let html = "";

  const paises = Object.keys(grupos).sort((a,b)=>{
    if(a === "International") return -1;
    if(b === "International") return 1;
    return a.localeCompare(b);
  });

  paises.forEach(pais=>{
    const ligas = grupos[pais];

    html += `
      <div class="country">

        <div class="country-title"
             onclick="toggleElemento(this.nextElementSibling)">
          🌎 ${escapeHTML(pais)}
          <span>▼</span>
        </div>

        <div>
    `;

    Object.keys(ligas).forEach(liga=>{
      const partidos = ligas[liga];

      html += `
        <div class="league">

          <div class="league-title"
               onclick="toggleElemento(this.nextElementSibling)">
            <span class="league-name">
              🏆 ${escapeHTML(liga)}
            </span>

            <span class="league-count">
              ${partidos.length} partidos ▼
            </span>
          </div>

          <div class="matches">
            ${partidos.map(crearPartido).join("")}
          </div>

        </div>
      `;
    });

    html += `
        </div>
      </div>
    `;
  });

  return html;
}

function toggleElemento(elemento){
  if(!elemento) return;

  if(elemento.style.display === "none"){
    elemento.style.display = "";
  }else{
    elemento.style.display = "none";
  }
}

function cambiarSeccion(seccion){
  seccionActual = seccion;

  document.getElementById("tabLive").classList.remove("active");
  document.getElementById("tabToday").classList.remove("active");
  document.getElementById("tabNext").classList.remove("active");

  if(seccion === "live"){
    document.getElementById("tabLive").classList.add("active");
  }

  if(seccion === "today"){
    document.getElementById("tabToday").classList.add("active");
  }

  if(seccion === "next"){
    document.getElementById("tabNext").classList.add("active");
  }

  mostrarSeccion();
}

function mostrarSeccion(){
  const app = document.getElementById("app");

  let lista = [];

  if(seccionActual === "live"){
    lista = datos.live;
  }

  if(seccionActual === "today"){
    lista = datos.today;
  }

  if(seccionActual === "next"){
    lista = datos.next;
  }

  app.innerHTML = crearHTML(lista);
}

async function fetchConTimeout(url,ms=20000){
  const controller = new AbortController();

  const timer = setTimeout(()=>{
    controller.abort();
  },ms);

  try{
    const respuesta = await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    return respuesta;

  }finally{
    clearTimeout(timer);
  }
}

async function cargarPartidos(){
  if(cargando) return;

  cargando = true;

  const status = document.getElementById("status");
  const app = document.getElementById("app");

  status.innerHTML = "⏳ Cargando partidos...";

  if(!datos.live.length && !datos.today.length && !datos.next.length){
    app.innerHTML = `
      <div class="loading">
        ⚽ Cargando partidos...<br>
        <span class="small">
          Esto puede tardar unos segundos.
        </span>
      </div>
    `;
  }

  try{

    const respuesta = await fetchConTimeout(
      "/api/football?t=" + Date.now(),
      20000
    );

    if(!respuesta.ok){
      throw new Error("HTTP " + respuesta.status);
    }

    const data = await respuesta.json();

    if(!data || data.success !== true){
      throw new Error("La API no devolvió datos válidos.");
    }

    datos.live = Array.isArray(data.enVivo)
      ? data.enVivo
      : [];

    datos.today = Array.isArray(data.partidosHoy)
      ? data.partidosHoy
      : [];

    datos.next = Array.isArray(data.partidosManana)
      ? data.partidosManana
      : [];

    status.innerHTML =
      `🟢 API conectada | 🔴 ${datos.live.length} en vivo | 📅 ${datos.today.length} hoy | ⏭️ ${datos.next.length} próximos`;

    mostrarSeccion();

  }catch(error){

    console.error(error);

    status.innerHTML =
      "🔴 No se pudo cargar la API";

    app.innerHTML = `
      <div class="error">
        <b>⚠️ No se pudieron cargar los partidos.</b>

        <p>
          La conexión tardó demasiado o la API devolvió un error.
        </p>

        <button class="retry" onclick="cargarPartidos()">
          🔄 REINTENTAR
        </button>
      </div>
    `;

  }finally{
    cargando = false;
  }
}

async function verPrediccion(id,boton){

  const caja = document.getElementById("pred-" + id);

  if(!caja) return;

  caja.classList.add("show");

  boton.disabled = true;
  boton.innerText = "⏳ Cargando predicción...";

  caja.innerHTML = `
    <div class="pred-title">🔮 Predicción</div>
    <div class="small">
      Consultando datos reales...
    </div>
  `;

  try{

    const respuesta = await fetchConTimeout(
      "/api/football?prediction=" +
      encodeURIComponent(id) +
      "&t=" + Date.now(),
      20000
    );

    if(!respuesta.ok){
      throw new Error("HTTP " + respuesta.status);
    }

    const data = await respuesta.json();

    const prediccion =
      data?.response?.[0]?.predictions ||
      data?.predictions ||
      null;

    if(!prediccion){

      caja.innerHTML = `
        <div class="pred-title">🔮 Predicción</div>
        <div class="note">
          ⚠️ Este partido no tiene predicción disponible.
        </div>
      `;

      return;
    }

    const percent = prediccion.percent || {};

    const home = percent.home ?? null;
    const draw = percent.draw ?? null;
    const away = percent.away ?? null;

    const btts =
      prediccion.btts?.yes ??
      prediccion.btts?.Yes ??
      null;

    const underOver =
      prediccion.under_over ??
      prediccion.under_over_1_5 ??
      null;

    const winner =
      prediccion.winner?.name ??
      null;

    const advice =
      prediccion.advice ??
      null;

    caja.innerHTML = `
      <div class="pred-title">
        🔮 DATOS DE PREDICCIÓN
      </div>

      <div class="pred-grid">

        <div class="pred-item">
          🏠 LOCAL
          <span class="percent ${colorPorcentaje(home)}">
            ${mostrarPorcentaje(home)}
          </span>
        </div>

        <div class="pred-item">
          🤝 EMPATE
          <span class="percent ${colorPorcentaje(draw)}">
            ${mostrarPorcentaje(draw)}
          </span>
        </div>

        <div class="pred-item">
          ✈️ VISITANTE
          <span class="percent ${colorPorcentaje(away)}">
            ${mostrarPorcentaje(away)}
          </span>
        </div>

      </div>

      <div class="pred-grid" style="margin-top:6px">

        <div class="pred-item">
          ⚽ BTTS
          <span class="percent ${colorPorcentaje(btts)}">
            ${mostrarPorcentaje(btts)}
          </span>
        </div>

        <div class="pred-item">
          📊 O/U
          <span class="percent">
            ${underOver ? escapeHTML(underOver) : "—"}
          </span>
        </div>

        <div class="pred-item">
          🏆 GANADOR
          <span class="percent" style="font-size:12px">
            ${winner ? escapeHTML(winner) : "—"}
          </span>
        </div>

      </div>

      ${
        advice
        ? `<div class="note">💡 ${escapeHTML(advice)}</div>`
        : ""
      }

      <div class="note">
        Los porcentajes se muestran solamente cuando la API los proporciona.
      </div>
    `;

  }catch(error){

    console.error(error);

    caja.innerHTML = `
      <div class="pred-title">
        🔮 Predicción
      </div>

      <div class="note">
        ⚠️ No se pudo consultar la predicción.
      </div>
    `;

  }finally{

    boton.disabled = false;
    boton.innerText = "🔮 VER PREDICCIÓN";

  }
}

/* CARGA INICIAL */
cargarPartidos();

/* ACTUALIZAR CADA 60 SEGUNDOS */
setInterval(()=>{
  cargarPartidos();
},60000);

</script>

</body>
</html>
