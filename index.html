<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOGER ATENCIO SPORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110b;
      color: white;
    }

    header {
      background: #0b1f12;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 2px solid #16c763;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 7px 0 0;
      color: #16c763;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .top h2 {
      margin: 0;
      font-size: 20px;
    }

    .refresh {
      background: #16c763;
      color: #001b09;
      border: 0;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .match {
      background: #102017;
      border: 1px solid #1e4930;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .league {
      color: #8de9ae;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: center;
    }

    .team {
      width: 40%;
      font-weight: bold;
    }

    .team img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
      min-width: 55px;
    }

    .status {
      color: #16c763;
      font-size: 13px;
      margin-top: 5px;
    }

    .live {
      color: #ff3b30;
      font-weight: bold;
    }

    .watch {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #16c763;
      color: #001b09;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch.disabled {
      background: #34433a;
      color: #aeb8b1;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #102017;
      border: 1px solid #16c763;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .option {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .netcom {
      background: #16c763;
      color: #001b09;
    }

    .official {
      background: #ffffff;
      color: #111111;
    }

    .close {
      background: #333;
      color: white;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px 10px;
      color: #b8c4bc;
    }

    .error {
      color: #ff7b72;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>🔴 FÚTBOL EN VIVO</p>
</header>

<div class="container">

  <div class="top">
    <h2>📺 Partidos de hoy</h2>
    <button class="refresh" onclick="cargarPartidos()">↻ Actualizar</button>
  </div>

  <div id="matches">
    <div class="loading">Cargando partidos...</div>
  </div>

</div>

<!-- VENTANA DE OPCIONES -->
<div class="modal" id="watchModal">
  <div class="modal-box">

    <h3>📺 Ver partido</h3>

    <p id="selectedMatch"></p>

    <button class="option netcom" onclick="abrirNetcom()">
      📺 VER EN NETCOM TV
    </button>

    <button class="option official" onclick="buscarOficial()">
      🌐 BUSCAR TRANSMISIÓN OFICIAL
    </button>

    <button class="option close" onclick="cerrarModal()">
      ✕ Cerrar
    </button>

  </div>
</div>

<script>

  let partidoSeleccionado = null;

  async function cargarPartidos() {

    const contenedor = document.getElementById("matches");

    contenedor.innerHTML =
      '<div class="loading">⏳ Cargando partidos...</div>';

    try {

      const respuesta = await fetch("/api/football");

      if (!respuesta.ok) {
        throw new Error("Error API");
      }

      const data = await respuesta.json();

      if (!data.response || data.response.length === 0) {
        contenedor.innerHTML =
          '<div class="empty">No hay partidos disponibles.</div>';
        return;
      }

      let partidos = data.response;

      // Partidos en vivo primero
      partidos.sort((a, b) => {

        const liveA = esEnVivo(a.fixture.status.short) ? 1 : 0;
        const liveB = esEnVivo(b.fixture.status.short) ? 1 : 0;

        return liveB - liveA;

      });

      contenedor.innerHTML = "";

      partidos.forEach(partido => {

        const fixture = partido.fixture;
        const home = partido.teams.home;
        const away = partido.teams.away;
        const league = partido.league;

        const enVivo = esEnVivo(fixture.status.short);

        let marcador = "";

        if (
          fixture.status.short === "NS"
        ) {

          const hora = new Date(
            fixture.date
          ).toLocaleTimeString(
            "es-VE",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

          marcador = hora;

        } else {

          marcador =
            `${partido.goals.home ?? 0} - ${partido.goals.away ?? 0}`;

        }

        let estado = fixture.status.long || "";

        if (enVivo) {

          estado =
            `🔴 EN VIVO ${fixture.status.elapsed ? fixture.status.elapsed + "'" : ""}`;

        }

        const card = document.createElement("div");

        card.className = "match";

        card.innerHTML = `

          <div class="league">
            ${league.name}
          </div>

          <div class="teams">

            <div class="team">
              ${
                home.logo
                ? `<img src="${home.logo}" alt="">`
                : ""
              }
              ${home.name}
            </div>

            <div class="score">
              ${marcador}
              <div class="status ${enVivo ? "live" : ""}">
                ${estado}
              </div>
            </div>

            <div class="team">
              ${
                away.logo
                ? `<img src="${away.logo}" alt="">`
                : ""
              }
              ${away.name}
            </div>

          </div>

          <button
            class="watch"
            onclick='abrirOpciones(${JSON.stringify(
              home.name + " vs " + away.name
            )})'
          >
            ▶️ VER EN VIVO
          </button>

        `;

        contenedor.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      contenedor.innerHTML = `
        <div class="error">
          ❌ No se pudieron cargar los partidos.
          <br><br>
          Pulsa "Actualizar" para intentar nuevamente.
        </div>
      `;

    }

  }

  function esEnVivo(status) {

    return [
      "1H",
      "2H",
      "HT",
      "ET",
      "BT",
      "P",
      "SUSP",
      "INT",
      "LIVE"
    ].includes(status);

  }

  function abrirOpciones(partido) {

    partidoSeleccionado = partido;

    document.getElementById("selectedMatch").textContent =
      partido;

    document.getElementById("watchModal").style.display =
      "flex";

  }

  function cerrarModal() {

    document.getElementById("watchModal").style.display =
      "none";

  }

  function abrirNetcom() {

    /*
      Intentamos abrir Netcom TV.

      Si Android reconoce un enlace de la aplicación,
      puede abrirla automáticamente.

      Si no lo reconoce, abrimos la web de Netcom.
    */

    window.location.href =
      "netcomtv://";

    setTimeout(() => {

      window.open(
        "https://www.google.com/search?q=Netcom+TV+Venezuela",
        "_blank"
      );

    }, 1200);

  }

  function buscarOficial() {

    if (!partidoSeleccionado) return;

    const consulta =
      partidoSeleccionado +
      " transmisión oficial en vivo";

    const url =
      "https://www.google.com/search?q=" +
      encodeURIComponent(consulta);

    window.open(url, "_blank");

  }

  // Cargar automáticamente
  cargarPartidos();

</script>

</body>
</html>
