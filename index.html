<script>

/* =========================================================

/* =========================================================
   ORDEN DE COMPETICIONES
   ========================================================= */

const ordenCompeticiones = [

  "Premier League",
  "La Liga",
  "Serie A",
  "Bundesliga",
  "Ligue 1",

  "UEFA Champions League",
  "UEFA Europa League",
  "UEFA Europa Conference League",

  "Brasileirão Série A",

  "Major League Soccer",
  "MLS",

  "Scottish Premiership",

  "Copa del Rey",
  "FA Cup",

  "League Cup",
  "DFB Pokal",
  "DFB-Pokal",
  "Coppa Italia",
  "Coupe de France",

  "Scottish Cup",

  "Copa Colombia",
  "Danish Cup",
  "Swiss Cup",
  "Bulgarian Cup",
  "NM Cup",
  "Norwegian Cup",

  "Supercopa de España",
  "Supercup",

  "Trophée des Champions",

  "Leagues Cup",

  "Copa América",
  "European Championship",
  "Euro Championship",
  "World Cup",
  "UEFA Nations League"
];


/* =========================================================
   DATOS
   ========================================================= */

let datos = {
  live: [],
  today: [],
  next: []
};

let seccionActual = "live";
let cargando = false;


/* =========================================================
   UTILIDADES
   ========================================================= */

function escapeHTML(texto){

  if(texto === null || texto === undefined){
    return "";
  }

  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalizarTexto(texto){

  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


function obtenerLiga(match){

  return match?.league?.name || "Otras ligas";

}


function obtenerPais(match){

  return match?.league?.country || "Internacional";

}


function nombreEquipo(team){

  return team?.name || "Equipo";

}


function logoEquipo(team){

  return team?.logo || "";

}


/* =========================================================
   HORA Y FECHA LOCAL DEL USUARIO
   ========================================================= */

function fechaHoraLocal(match){

  const fecha = match?.fixture?.date;

  if(!fecha){
    return {
      fecha:"--/--/----",
      hora:"--:--"
    };
  }

  try{

    const date = new Date(fecha);

    const hora = new Intl.DateTimeFormat(
      navigator.language || "es-ES",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(date);

    const fechaTexto = new Intl.DateTimeFormat(
      navigator.language || "es-ES",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(date);

    return {
      fecha:fechaTexto,
      hora:hora
    };

  }catch(e){

    return {
      fecha:"--/--/----",
      hora:"--:--"
    };

  }

}


function horaPartido(match){

  return fechaHoraLocal(match).hora;

}


function fechaPartido(match){

  return fechaHoraLocal(match).fecha;

}


/* =========================================================
   ESTADO DEL PARTIDO
   ========================================================= */

function estadoPartido(match){

  const status = match?.fixture?.status;

  if(!status){
    return "--:--";
  }

  if(status.short === "NS"){
    return horaPartido(match);
  }

  if(status.short === "HT"){
    return "DESCANSO";
  }

  if(status.short === "FT"){
    return "FINAL";
  }

  if(status.short === "PST"){
    return "APLAZADO";
  }

  if(status.short === "CANC"){
    return "CANCELADO";
  }

  if(status.short === "ABD"){
    return "ABANDONADO";
  }

  if(status.elapsed){
    return status.elapsed + "'";
  }

  return horaPartido(match);

}


function esEnVivo(match){

  const s = match?.fixture?.status?.short;

  return [
    "1H",
    "2H",
    "HT",
    "ET",
    "BT",
    "P",
    "LIVE"
  ].includes(s);

}


/* =========================================================
   COLORES PREDICCIÓN
   ========================================================= */

function colorPorcentaje(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return "";
  }

  const numero =
    parseFloat(
      String(valor).replace("%","")
    );

  if(isNaN(numero)){
    return "";
  }

  if(numero >= 70){
    return "green";
  }

  if(numero >= 50){
    return "yellow";
  }

  return "red";

}


function mostrarPorcentaje(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return "—";
  }

  return String(valor).includes("%")
    ? String(valor)
    : String(valor) + "%";

}


/* =========================================================
   FILTRO DE SEGURIDAD DEL FRONTEND
   ========================================================= */

function esCompeticionPermitida(match){

  const liga = normalizarTexto(
    obtenerLiga(match)
  );

  const permitidas =
    competicionesPermitidas.map(
      normalizarTexto
    );

  return permitidas.includes(liga);

}


/* =========================================================
   ORDENAR
   ========================================================= */

function obtenerOrdenLiga(nombre){

  const index =
    ordenCompeticiones.findIndex(
      liga =>
        normalizarTexto(liga) ===
        normalizarTexto(nombre)
    );

  return index === -1
    ? 999
    : index;

}


function ordenarPartidos(lista){

  return [...lista].sort((a,b)=>{

    const ligaA = obtenerLiga(a);
    const ligaB = obtenerLiga(b);

    const ordenA =
      obtenerOrdenLiga(ligaA);

    const ordenB =
      obtenerOrdenLiga(ligaB);

    if(ordenA !== ordenB){
      return ordenA - ordenB;
    }

    const da =
      new Date(
        a?.fixture?.date || 0
      ).getTime();

    const db =
      new Date(
        b?.fixture?.date || 0
      ).getTime();

    return da - db;

  });

}


/* =========================================================
   AGRUPAR PAÍS → LIGA
   ========================================================= */

function agrupar(lista){

  const paises = {};

  lista
    .filter(esCompeticionPermitida)
    .forEach(match=>{

      const pais =
        obtenerPais(match);

      const liga =
        obtenerLiga(match);

      if(!paises[pais]){
        paises[pais] = {};
      }

      if(!paises[pais][liga]){
        paises[pais][liga] = [];
      }

      paises[pais][liga].push(match);

    });

  return paises;

}


/* =========================================================
   CREAR PARTIDO
   ========================================================= */

function crearPartido(match){

  const home =
    match?.teams?.home || {};

  const away =
    match?.teams?.away || {};

  const live =
    esEnVivo(match);

  const homeScore =
    match?.goals?.home;

  const awayScore =
    match?.goals?.away;

  const scoreVisible =
    homeScore !== null &&
    homeScore !== undefined &&
    awayScore !== null &&
    awayScore !== undefined;

  const liga =
    obtenerLiga(match);

  const id =
    match?.fixture?.id;

  let html = `

    <div class="match">

      <div class="match-top">

        <span class="${live ? "live" : ""}">
          ${
            live
            ? "🔴 EN VIVO"
            : "⚽ PARTIDO"
          }
        </span>

        <span>
          ${escapeHTML(
            estadoPartido(match)
          )}
        </span>

      </div>

      <div class="match-date">
        📅 ${escapeHTML(
          fechaPartido(match)
        )}
        &nbsp; • &nbsp;
        🕐 ${escapeHTML(
          horaPartido(match)
        )}
      </div>

      <div class="teams">

        <div class="team">

          ${
            logoEquipo(home)
            ?
            `<img
              src="${escapeHTML(
                logoEquipo(home)
              )}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          ${escapeHTML(
            nombreEquipo(home)
          )}

        </div>

        <div class="score">

          ${
            scoreVisible
            ?
            `${homeScore} - ${awayScore}`
            :
            "VS"
          }

        </div>

        <div class="team">

          ${
            logoEquipo(away)
            ?
            `<img
              src="${escapeHTML(
                logoEquipo(away)
              )}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          ${escapeHTML(
            nombreEquipo(away)
          )}

        </div>

      </div>

  `;


  if(id){

    html += `

      <button
        class="pred-btn"
        onclick="verPrediccion('${id}',this)"
      >
        🔮 VER PREDICCIÓN
      </button>

      <div
        class="prediction"
        id="pred-${id}"
      >

        <div class="pred-title">
          🔮 PREDICCIONES CAPIBARBER
        </div>

        <div class="small">
          Pulsa el botón para consultar los datos.
        </div>

      </div>

    `;

  }


  html += `</div>`;

  return html;

}


/* =========================================================
   CREAR HTML COMPLETO
   ========================================================= */

function crearHTML(lista){

  const filtrados =
    (lista || [])
    .filter(esCompeticionPermitida);

  if(filtrados.length === 0){

    return `

      <div class="empty">

        ⚽ No hay partidos para mostrar
        en esta sección.

        <br><br>

        <span class="small">
          Las competiciones mostradas están
          limitadas a las seleccionadas.
        </span>

      </div>

    `;

  }


  const grupos =
    agrupar(
      ordenarPartidos(filtrados)
    );


  let html = "";


  const paises =
    Object.keys(grupos)
    .sort((a,b)=>{

      if(
        a.toLowerCase()
        .includes("international")
      ){
        return -1;
      }

      if(
        b.toLowerCase()
        .includes("international")
      ){
        return 1;
      }

      return a.localeCompare(b);

    });


  paises.forEach(pais=>{

    const ligas =
      grupos[pais];


    const ligasOrdenadas =
      Object.keys(ligas)
      .sort(
        (a,b)=>
          obtenerOrdenLiga(a) -
          obtenerOrdenLiga(b)
      );


    html += `

      <div class="country">

        <div
          class="country-title"
          onclick="togglePais(this)"
        >

          <span>
            🌎 ${escapeHTML(pais)}
          </span>

          <span class="country-arrow">
            ▼
          </span>

        </div>

        <div class="country-content">

    `;


    ligasOrdenadas.forEach(liga=>{

      const partidos =
        ordenarPartidos(
          ligas[liga]
        );


      html += `

        <div class="league">

          <div
            class="league-title"
            onclick="toggleLiga(this)"
          >

            <span class="league-name">
              🏆 ${escapeHTML(liga)}
            </span>

            <span class="league-right">

              <span class="league-count">
                ${partidos.length}
              </span>

              <span class="league-arrow">
                ▼
              </span>

            </span>

          </div>

          <div class="matches">

            ${partidos
              .map(crearPartido)
              .join("")}

          </div>

        </div>

      `;

    });


    html += `

        </div>

      </div>

    `;

  });


  return html;

}


/* =========================================================
   ABRIR / CERRAR PAÍS
   ========================================================= */

function togglePais(titulo){

  const country =
    titulo.parentElement;

  country.classList.toggle("closed");

}


/* =========================================================
   ABRIR / CERRAR LIGA
   ========================================================= */

function toggleLiga(titulo){

  const league =
    titulo.parentElement;

  league.classList.toggle("closed");

}


/* =========================================================
   CAMBIAR SECCIÓN
   ========================================================= *
