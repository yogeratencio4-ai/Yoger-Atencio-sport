<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOGER ATENCIO SPORT</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07140d;
 color:white;
 font-family:Arial,sans-serif
}
header{
 background:#0b2417;
 padding:18px 10px;
 text-align:center;
 border-bottom:1px solid #1c4d31;
 position:sticky;
 top:0;
 z-index:10
}
header h1{margin:0 0 6px;font-size:23px}
header p{margin:0;color:#55ff91;font-weight:bold;font-size:13px}
main{max-width:700px;margin:auto;padding:12px}
.estado{
 background:#0b2417;
 border:1px solid #1c4d31;
 border-radius:10px;
 padding:12px;
 text-align:center;
 margin-bottom:12px
}
#estado{color:#55ff91;font-weight:bold}
.grupo{
 margin-bottom:10px;
 border:1px solid #1c4d31;
 border-radius:10px;
 overflow:hidden;
 background:#0b2417
}
.grupo summary{
 padding:15px;
 cursor:pointer;
 font-size:17px;
 font-weight:bold;
 list-style:none
}
.grupo summary::-webkit-details-marker{display:none}
.grupo summary:after{
 content:"＋";
 float:right;
 color:#55ff91
}
.grupo[open]>summary:after{content:"−"}
.pais{
 margin:8px;
 border:1px solid #245437;
 border-radius:8px;
 overflow:hidden
}
.pais summary{
 background:#091c11;
 padding:13px;
 cursor:pointer;
 list-style:none;
 font-weight:bold
}
.pais summary::-webkit-details-marker{display:none}
.pais summary:after{
 content:"＋";
 float:right;
 color:#55ff91
}
.pais[open]>summary:after{content:"−"}
.liga{
 margin:6px;
 border:1px solid #1c4d31;
 border-radius:7px;
 overflow:hidden
}
.liga summary{
 padding:11px;
 cursor:pointer;
 list-style:none;
 color:#55ff91;
 font-weight:bold;
 font-size:14px
}
.liga summary::-webkit-details-marker{display:none}
.liga summary:after{
 content:"＋";
 float:right;
 color:#aaa
}
.liga[open]>summary:after{content:"−"}
.partidos{padding:6px}
.partido{
 background:#07140d;
 border:1px solid #1c4d31;
 border-radius:8px;
 padding:12px;
 margin-bottom:6px
}
.equipos{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:5px;
 font-weight:bold;
 font-size:14px
}
.equipo{width:40%;text-align:center}
.resultado{
 width:20%;
 text-align:center;
 color:#55ff91;
 font-size:16px
}
.hora{
 text-align:center;
 color:#aaa;
 font-size:12px;
 margin-top:7px
}
.vivo{
 display:block;
 width:max-content;
 margin:7px auto 0;
 background:#d90000;
 padding:4px 8px;
 border-radius:6px;
 font-size:11px;
 font-weight:bold
}
.vacio{
 padding:18px;
 text-align:center;
 color:#999
}
.error{
 background:#351010;
 color:#ffaaaa;
 padding:12px;
 border-radius:8px;
 margin-bottom:12px
}
footer{
 text-align:center;
 color:#666;
 padding:25px
}
</style></head><body><header>
<h1>⚽ YOGER ATENCIO SPORT</h1>
<p>PARTIDOS DE FÚTBOL</p>
</header><main><div class="estado">
Estado: <span id="estado">Conectando...</span>
<div id="actualizando">Cargando partidos...</div>
</div><div id="error"></div><details class="grupo" open>
<summary>🔴 EN VIVO</summary>
<div id="vivo"><div class="vacio">Cargando...</div></div>
</details><details class="grupo" open>
<summary>⚽ PARTIDOS DE HOY</summary>
<div id="hoy"><div class="vacio">Cargando...</div></div>
</details><details class="grupo" open>
<summary>📅 PRÓXIMOS PARTIDOS</summary>
<div id="manana"><div class="vacio">Cargando...</div></div>
</details></main><footer>YOGER ATENCIO SPORT</footer><script>

const vivo=document.getElementById("vivo");
const hoy=document.getElementById("hoy");
const manana=document.getElementById("manana");
const estado=document.getElementById("estado");
const error=document.getElementById("error");
const actualizando=document.getElementById("actualizando");


/* ORDEN DE LOS PAISES */

const paises=[
"Spain",
"England",
"Italy",
"Germany",
"France",
"Brazil",
"Argentina",
"Netherlands",
"Portugal",
"Belgium",
"Turkey",
"Saudi-Arabia",
"USA",
"Mexico",
"Colombia",
"Chile",
"Peru",
"Austria",
"Switzerland",
"Denmark",
"Scotland",
"Greece",
"Norway",
"Sweden",
"Poland",
"Croatia",
"Serbia",
"Romania",
"Bulgaria",
"Cyprus",
"Venezuela"
];


/* BANDERAS */

function bandera(pais){

const p=pais.toLowerCase();

if(p.includes("spain")||p.includes("espa"))return"🇪🇸";
if(p.includes("england")||p.includes("inglat"))return"🇬🇧";
if(p.includes("italy")||p.includes("ital"))return"🇮🇹";
if(p.includes("germany")||p.includes("alem"))return"🇩🇪";
if(p.includes("france")||p.includes("franc"))return"🇫🇷";
if(p.includes("brazil")||p.includes("brasil"))return"🇧🇷";
if(p.includes("argentina"))return"🇦🇷";
if(p.includes("netherlands")||p.includes("paises"))return"🇳🇱";
if(p.includes("portugal"))return"🇵🇹";
if(p.includes("belg"))return"🇧🇪";
if(p.includes("turkey")||p.includes("turqu"))return"🇹🇷";
if(p.includes("saudi"))return"🇸🇦";
if(p.includes("usa")||p.includes("united states"))return"🇺🇸";
if(p.includes("mexico"))return"🇲🇽";
if(p.includes("colombia"))return"🇨🇴";
if(p.includes("chile"))return"🇨🇱";
if(p.includes("peru"))return"🇵🇪";
if(p.includes("austria"))return"🇦🇹";
if(p.includes("switzerland"))return"🇨🇭";
if(p.includes("denmark"))return"🇩🇰";
if(p.includes("scotland"))return"🏴";
if(p.includes("greece"))return"🇬🇷";
if(p.includes("norway"))return"🇳🇴";
if(p.includes("sweden"))return"🇸🇪";
if(p.includes("poland"))return"🇵🇱";
if(p.includes("croatia"))return"🇭🇷";
if(p.includes("serbia"))return"🇷🇸";
if(p.includes("romania"))return"🇷🇴";
if(p.includes("bulgaria"))return"🇧🇬";
if(p.includes("cyprus"))return"🇨🇾";
if(p.includes("venezuela"))return"🇻🇪";

return"🌍";
}


/* HORA */

function hora(fecha){

if(!fecha)return"--:--";

const d=new Date(fecha);

if(isNaN(d))return"--:--";

return d.toLocaleTimeString("es-ES",{
hour:"2-digit",
minute:"2-digit"
});

}


/* PARTIDO */

function partido(p,vivo){

if(!p||!p.fixture)return"";

const h=p.teams?.home?.name||"Local";
const a=p.teams?.away?.name||"Visitante";
const gh=p.goals?.home;
const ga=p.goals?.away;

let marcador="VS";

if(gh!==null&&gh!==undefined&&ga!==null&&ga!==undefined){
marcador=gh+" - "+ga;
}

return `
<div class="partido">

<div class="equipos">
<div class="equipo">${h}</div>
<div class="resultado">${marcador}</div>
<div class="equipo">${a}</div>
</div>

${
vivo
?
`<div class="vivo">🔴 EN VIVO ${p.fixture.status?.elapsed||""}'</div>`
:
`<div class="hora">🕐 ${hora(p.fixture.date)}</div>`
}

</div>
`;

}


/* AGRUPAR */

function mostrar(lista,caja,vivo=false){

if(!Array.isArray(lista)||!lista.length){

caja.innerHTML=
`<div class="vacio">
${vivo?"No hay partidos en vivo.":"No hay partidos disponibles."}
</div>`;

return;
}

const grupos={};

lista.forEach(p=>{

const pais=p.league?.country||"Otros";
const liga=p.league?.name||"Fútbol";

if(!grupos[pais])grupos[pais]={};

if(!grupos[pais][liga])grupos[pais][liga]=[];

grupos[pais][liga].push(p);

});


const nombres=Object.keys(grupos);

nombres.sort((a,b)=>{

let A=paises.findIndex(x=>a.toLowerCase().includes(x.toLowerCase()));
let B=paises.findIndex(x=>b.toLowerCase().includes(x.toLowerCase()));

if(A<0)A=999;
if(B<0)B=999;

return A-B;

});


let html="";

nombres.forEach((pais,i)=>{

html+=`
<details class="pais" ${i===0?"open":""}>

<summary>
${bandera(pais)} ${pais}
</summary>
`;

const ligas=Object.keys(grupos[pais]);

ligas.sort();

ligas.forEach((liga,j)=>{

html+=`
<details class="liga" ${j===0?"open":""}>

<summary>🏆 ${liga} (${grupos[pais][liga].length})</summary>

<div class="partidos">

${grupos[pais][liga]
.map(p=>partido(p,vivo))
.join("")}

</div>

</details>
`;

});

html+="</details>";

});

caja.innerHTML=html;

}


/* CARGAR API */

async function cargar(){

try{

estado.textContent="Conectando...";
error.innerHTML="";

const r=await fetch("/api/football?x="+Date.now());

const data=await r.json();

if(!r.ok)throw new Error(data.error||"Error de API");

mostrar(data.enVivo||[],vivo,true);
mostrar(data.partidosHoy||[],hoy,false);
mostrar(data.partidosManana||[],manana,false);

estado.textContent="Conectado";

actualizando.textContent=
"Actualizado: "+
new Date().toLocaleTimeString("es-ES");

}catch(e){

console.error(e);

estado.textContent="Error";

error.innerHTML=
`<div class="error">⚠️ ${e.message}</div>`;

}

}

cargar();

setInterval(cargar,60000);

</script></body>
</html>
