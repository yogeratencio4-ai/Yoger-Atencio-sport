<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="cambiarTab('live',this)">🔴 EN VIVO</button>
  <button class="tab" onclick="cambiarTab('today',this)">📅 HOY</button>
  <button class="tab" onclick="cambiarTab('next',this)">⏭️ PRÓXIMOS</button>
</div>

<div class="container">
  <div id="status" class="status">Cargando partidos...</div>
  <div id="matches"></div>
</div>

<script>

const API_URL = "/api/football";

let datos = {
  enVivo: [],
  partidosHoy: [],
  partidosManana: [],
  partidos: []
};

let tabActual = "live";

/* =========================
   UTILIDADES
========================= */

function buscar(obj, claves, defecto=""){
  for(const clave of claves){
    if(obj && obj[clave] !== undefined && obj[clave] !== null){
      return obj[clave];
    }
  }
  return defecto;
}

function obtenerFixture(p){
  return buscar(p,["fixture","partido"],{});
}

function obtenerLiga(p){
  return buscar(p,["league","liga"],{});
}

function obtenerEquipos(p){
  return buscar(p,["teams","equipos"],{});
}

function obtenerGoles(p){
  return buscar(p,["goals","goles"],{});
}

function obtenerMarcador(p){
  return buscar(p,["score","marcador","resultado"],{});
}

function nombreEquipo(e){
  return buscar(e,["name","nombre"],"Equipo");
}

function banderaPais(p){
  const liga = obtenerLiga(p);
  return buscar(liga,["country","pais"],"Otros");
}

function nombreLiga(p){
  const liga = obtenerLiga(p);
  return buscar(liga,["name","nombre"],"Liga");
}

function fechaPartido(p){

  const fixture = obtenerFixture(p);

  let fecha = buscar(
    fixture,
    ["date","fecha","datetime","fechaHora"],
    ""
  );

  if(!fecha){
    fecha = buscar(
      p,
      ["date","fecha","datetime","fechaHora"],
      ""
    );
  }

  return fecha;
}

function esLive(p){
  const fixture = obtenerFixture(p);

  const status = buscar(
    fixture,
    ["status","estado"],
    {}
  );

  const short = buscar(
    status,
    ["short","codigo"],
    ""
  );

  const long = buscar(
    status,
    ["long","descripcion"],
    ""
  );

  return (
    ["1H","2H","HT","ET","P","LIVE","INT","BT"].includes(short) ||
    String(long).toLowerCase().includes("live") ||
    String(long).toLowerCase().includes("en vivo")
  );
}

function horaYFecha(p){

  const fecha = fechaPartido(p);

  if(!fecha){
    return "Horario no disponible";
  }

  const d = new Date(fecha);

  if(isNaN(d.getTime())){
    return fecha;
  }

  const dia = String(d.getDate()).padStart(2,"0");
  const mes = String(d.getMonth()+1).padStart(2,"0");
  const año = d.getFullYear();

  const hora = String(d.getHours()).padStart(2,"0");
  const minuto = String(d.getMinutes()).padStart(2,"0");

  return `${dia}/${mes}/${año} · ${hora}:${minuto}`;
}

function marcador(p){

  const goles = obtenerGoles(p);
  const score = obtenerMarcador(p);

  const local = buscar(
    goles,
    ["home","local"],
    buscar(score,["home","local"],null)
  );

  const visitante = buscar(
    goles,
    ["away","visitante"],
    buscar(score,["away","visitante"],null)
  );

  if(local === null && visitante === null){
    return "";
  }

  return `${local ?? 0} - ${visitante ?? 0}`;
}

/* =========================
   PRONÓSTICOS
========================= */

/*
  IMPORTANTE:
  Estos porcentajes se muestran LOCALMENTE.
  No hacen ninguna consulta adicional a API-Football.
*/

function crearPronosticos(local, visitante){

  const esJunior =
    local.toLowerCase().includes("junior") &&
    visitante.toLowerCase().includes("medell");

  if(esJunior){

    return `
      <div class="pred-title">PRONÓSTICOS DEL PARTIDO</div>

      <div class="pred-match">
        ${local} vs ${visitante}
      </div>

      <div class="pred-section">⚽ 1X2</div>

      <div class="pred-row">
        <span class="pred-name">Junior</span>
        <span class="pred-percent">29%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Empate</span>
        <span class="pred-percent">26%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Independiente Medellín</span>
        <span class="pred-percent">44%</span>
      </div>

      <div class="pred-section">⚽ Goles</div>

      <div class="pred-row">
        <span class="pred-name">Más 1.5 goles</span>
        <span class="pred-percent">82%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Menos 3.5 goles</span>
        <span class="pred-percent">76%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">BTTS — Sí</span>
        <span class="pred-percent">63%</span>
      </div>

      <div class="pred-section">⚽ Córners</div>

      <div class="pred-row">
        <span class="pred-name">Más 6.5 córners</span>
        <span class="pred-percent">78%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Menos 11.5 córners</span>
        <span class="pred-percent">81%</span>
      </div>

      <div class="pred-section">⚽ Tarjetas</div>

      <div class="pred-row">
        <span class="pred-name">Más 3.5 tarjetas</span>
        <span class="pred-percent">69%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Menos 5.5 tarjetas</span>
        <span class="pred-percent">72%</span>
      </div>

      <div class="pred-section">⚽ Otros mercados</div>

      <div class="pred-row">
        <span class="pred-name">Doble oportunidad 1X</span>
        <span class="pred-percent">55%</span>
      </div>

      <div class="pred-row">
        <span class="pred-name">Doble oportunidad X2</span>
        <span class="pred-percent">70%</span>
      </div>

      <div class="note">
        Porcentajes orientativos de pronóstico.
        No representan garantía de resultado.
      </div>
    `;

  }

  /*
    Para los demás partidos mostramos la misma estructura,
    pero sin inventar datos específicos.
  */

  return `
    <div class="pred-title">PRONÓSTICOS DEL PARTIDO</div>

    <div class="pred-match">
      ${local} vs ${visitante}
    </div>

    <div class="pred-section">⚽ 1X2</div>

    <div class="pred-row">
      <span class="pred-name">${local}</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">Empate</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">${visitante}</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-section">⚽ Goles</div>

    <div class="pred-row">
      <span class="pred-name">Más 1.5 goles</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">Menos 3.5 goles</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">BTTS</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-section">⚽ Córners</div>

    <div class="pred-row">
      <span class="pred-name">Más 6.5 córners</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">Menos 11.5 córners</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-section">⚽ Tarjetas</div>

    <div class="pred-row">
      <span class="pred-name">Más 3.5 tarjetas</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-row">
      <span class="pred-name">Menos 5.5 tarjetas</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="pred-section">⚽ Otros mercados</div>

    <div class="pred-row">
      <span class="pred-name">Próximamente</span>
      <span class="pred-percent">—%</span>
    </div>

    <div class="note">
      Los pronósticos detallados se conectarán posteriormente
      sin realizar consultas automáticas para todos los partidos.
    </div>
  `;
}

/* =========================
   MOSTRAR PARTIDOS
========================= */

function mostrarPartidos(lista){

  const contenedor = document.getElementById("matches");

  contenedor.innerHTML = "";

  if(!lista || lista.length === 0){

    contenedor.innerHTML = `
      <div class="empty">
        ⚽ No hay partidos disponibles en esta sección.
      </div>
    `;

    return;
  }

  const paises = {};

  lista.forEach(p => {

    const pais = banderaPais(p);
    const liga = nombreLiga(p);

    if(!paises[pais]){
      paises[pais] = {};
    }

    if(!paises[pais][liga]){
      paises[pais][liga] = [];
    }

    paises[pais][liga].push(p);

  });

  Object.keys(paises).forEach(pais => {

    const country = document.createElement("div");
    country.className = "country";

    country.innerHTML = `
      <div class="country-title"
           onclick="this.parentElement.classList.toggle('closed')">
        <span>🌎 ${pais}</span>
        <span class="arrow">▼</span>
      </div>

      <div class="country-content"></div>
    `;

    const countryContent =
      country.querySelector(".country-content");

    Object.keys(paises[pais]).forEach(liga => {

      const league = document.createElement("div");
      league.className = "league";

      league.innerHTML = `
        <div class="league-title"
             onclick="this.parentElement.classList.toggle('closed')">
          <span>🏆 ${liga}</span>
          <span class="arrow">▼</span>
        </div>

        <div class="league-content"></div>
      `;

      const leagueContent =
        league.querySelector(".league-content");

      paises[pais][liga].forEach(p => {

        const equipos = obtenerEquipos(p);

        const local = nombreEquipo(
          buscar(equipos,["home","local"],{})
        );

        const visitante = nombreEquipo(
          buscar(equipos,["away","visitante"],{})
        );

        const live = esLive(p);

        const partido = document.createElement("div");
        partido.className = "match";

        const fechaTexto =
          live
          ? "🔴 EN VIVO"
          : horaYFecha(p);

        const marcadorTexto =
          marcador(p);

        const id =
          "pred_" +
          Math.random().toString(36).substring(2,10);

        partido.innerHTML = `

          <div class="match-top">

            <span class="match-date">
              ${fechaTexto}
            </span>

            ${
              live
              ? `<span class="live">● EN VIVO</span>`
              : ""
            }

          </div>

          <div class="teams">

            <div>${local}</div>

            ${
              marcadorTexto
              ? `<div class="score">${marcadorTexto}</div>`
              : `<div class="score">VS</div>`
            }

            <div>${visitante}</div>

          </div>

          <button
            class="pred-button"
            onclick="abrirPronosticos('${id}')">

            🔮 PRONÓSTICOS

          </button>

          <div
            id="${id}"
            class="predictions">

            ${crearPronosticos(local,visitante)}

          </div>
        `;

        leagueContent.appendChild(partido);

      });

      countryContent.appendChild(league);

    });

    contenedor.appendChild(country);

  });

}

/* =========================
   ABRIR PRONÓSTICOS
========================= */

function abrirPronosticos(id){

  const panel = document.getElementById(id);

  if(!panel) return;

  panel.classList.toggle("open");

}

/* =========================
   TABS
========================= */

function cambiarTab(tab, boton){

  tabActual = tab;

  document.querySelectorAll(".tab")
    .forEach(b => b.classList.remove("active"));

  boton.classList.add("active");

  let lista = [];

  if(tab === "live"){
    lista = datos.enVivo || [];
  }

  if(tab === "today"){
    lista = datos.partidosHoy || [];
  }

  if(tab === "next"){
    lista = datos.partidosManana || [];
  }

  mostrarPartidos(lista);

}

/* =========================
   CARGAR API
================
