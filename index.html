<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOGER ATENCIO SPORT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#06140d;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#073d20,#0b6b35);
  padding:22px 15px;
  text-align:center;
  border-bottom:2px solid #18c66a;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#b8ffd5;
  font-size:13px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:12px;
}

.status{
  text-align:center;
  background:#0b2417;
  border:1px solid #174d2e;
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.tab{
  flex:1;
  border:0;
  padding:12px 5px;
  border-radius:9px;
  background:#10291b;
  color:#aaa;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#10a957;
  color:#fff;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.country{
  margin-bottom:12px;
  border:1px solid #174d2e;
  border-radius:10px;
  overflow:hidden;
  background:#091c11;
}

.country-title{
  background:#0d3320;
  padding:13px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.country-title span:last-child{
  color:#7cffae;
  font-size:13px;
}

.league{
  margin:8px;
  border:1px solid #1b5735;
  border-radius:8px;
  overflow:hidden;
}

.league-title{
  background:#10291b;
  padding:11px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.league-name{
  display:flex;
  align-items:center;
  gap:8px;
}

.league-logo{
  width:25px;
  height:25px;
  object-fit:contain;
}

.matches{
  padding:5px;
  background:#07170e;
}

.match{
  background:#0d2517;
  border:1px solid #163e28;
  border-radius:8px;
  margin:6px 0;
  padding:11px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#8fd9aa;
  font-size:11px;
  margin-bottom:8px;
}

.status-live{
  color:#ff4d4d;
  font-weight:bold;
}

.status-finished{
  color:#aaa;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:bold;
  font-size:14px;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:30px;
  height:30px;
  object-fit:contain;
}

.score{
  min-width:55px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.time{
  font-size:12px;
  color:#9cffbc;
  text-align:center;
  margin-top:7px;
}

.events{
  margin-top:8px;
  border-top:1px solid #183d28;
  padding-top:7px;
  font-size:11px;
  color:#bbb;
}

.no-games{
  text-align:center;
  padding:35px 15px;
  color:#8ca494;
}

.loading{
  text-align:center;
  padding:40px 10px;
  color:#8fffb6;
}

.refresh{
  width:100%;
  border:0;
  padding:12px;
  border-radius:8px;
  background:#0da653;
  color:white;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

@media(max-width:600px){
  header h1{
    font-size:22px;
  }

  .team{
    font-size:12px;
  }

  .team-logo{
    width:25px;
    height:25px;
  }

  .score{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="container">

  <div class="status" id="status">
    Conectando con los partidos...
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mostrarSeccion('live',this)">
      🔴 EN VIVO
    </button>

    <button class="tab" onclick="mostrarSeccion('today',this)">
      📅 HOY
    </button>

    <button class="tab" onclick="mostrarSeccion('next',this)">
      ⏭️ PRÓXIMOS
    </button>
  </div>

  <div id="live" class="section active">
    <div class="loading">Cargando partidos en vivo...</div>
  </div>

  <div id="today" class="section">
    <div class="loading">Cargando partidos...</div>
  </div>

  <div id="next" class="section">
    <div class="loading">Cargando próximos partidos...</div>
  </div>

  <button class="refresh" onclick="cargarPartidos()">
    🔄 ACTUALIZAR PARTIDOS
  </button>

</div>

<script>

const API_URL = "/api/football";

function valor(obj, claves, defecto=""){
  if(!obj) return defecto;

  for(const clave of claves){
    if(obj[clave] !== undefined && obj[clave] !== null){
      return obj[clave];
    }
  }

  return defecto;
}

function obtenerFixture(item){
  return valor(item,["fixture","partido"],{});
}

function obtenerLeague(item){
  return valor(item,["league","liga"],{});
}

function obtenerTeams(item){
  return valor(item,["teams","equipos"],{});
}

function obtenerGoals(item){
  return valor(item,["goals","goles"],{});
}

function obtenerScore(item){
  return valor(item,["score","marcador","resultado"],{});
}

function equipoLocal(teams){
  return valor(teams,["home","local"],{});
}

function equipoVisitante(teams){
  return valor(teams,["away","visitante"],{});
}

function nombreEquipo(team){
  return valor(team,["name","nombre"],"Equipo");
}

function logoEquipo(team){
  return valor(team,["logo"],"");
}

function nombreLiga(league){
  return valor(league,["name","nombre"],"Liga");
}

function paisLiga(league){
  return valor(league,["country","país","pais"],"Otros");
}

function logoLiga(league){
  return valor(league,["logo"],"");
}

function estadoFixture(fixture){
  return valor(fixture,["status","estado"],{});
}

function estadoCorto(status){
  return valor(status,["short","corto"],"");
}

function estadoLargo(status){
  return valor(status,["long","largo"],"");
}

function minuto(status){
  return valor(status,["elapsed","transcurrido"],null);
}

function fechaFixture(fixture){
  return valor(fixture,["date","fecha"],"");
}

function formatoHora(fecha){
  if(!fecha) return "";

  const d = new Date(fecha);

  if(isNaN(d.getTime())) return "";

  return d.toLocaleTimeString("es-ES",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function esEnVivo(item){

  const fixture = obtenerFixture(item);
  const status = estadoFixture(fixture);

  const corto = String(estadoCorto(status)).toUpperCase();
  const largo = String(estadoLargo(status)).toLowerCase();

  if(
    corto === "1H" ||
    corto === "2H" ||
    corto === "HT" ||
    corto === "ET" ||
    corto === "P" ||
    corto === "LIVE"
  ){
    return true;
  }

  if(
    largo.includes("first half") ||
    largo.includes("second half") ||
    largo.includes("primera mitad") ||
    largo.includes("segunda mitad") ||
    largo.includes("descanso") ||
    largo.includes("en vivo")
  ){
    return true;
  }

  return false;
}

function marcador(item){

  const goals = obtenerGoals(item);

  let home = valor(goals,["home","local"],null);
  let away = valor(goals,["away","visitante"],null);

  if(home !== null || away !== null){
    return `${home ?? 0} - ${away ?? 0}`;
  }

  const score = obtenerScore(item);

  const half = valor(score,["halftime","medio tiempo"],null);

  if(half){
    const h = valor(half,["home","local"],null);
    const a = valor(half,["away","visitante"],null);

    if(h !== null || a !== null){
      return `${h ?? 0} - ${a ?? 0}`;
    }
  }

  return "-";
}

function ordenarPartidos(lista){

  return [...lista].sort((a,b)=>{

    const fa = new Date(fechaFixture(obtenerFixture(a))).getTime();
    const fb = new Date(fechaFixture(obtenerFixture(b))).getTime();

    if(isNaN(fa)) return 1;
    if(isNaN(fb)) return -1;

    return fa-fb;
  });

}

function agrupar(lista){

  const paises = {};

  ordenarPartidos(lista).forEach(item=>{

    const league = obtenerLeague(item);

    const pais = paisLiga(league);
    const liga = nombreLiga(league);

    if(!paises[pais]){
      paises[pais] = {};
    }

    if(!paises[pais][liga]){
      paises[pais][liga] = {
        logo:logoLiga(league),
        partidos:[]
      };
    }

    paises[pais][liga].partidos.push(item);

  });

  return paises;
}

function crearPartido(item, enVivo=false){

  const fixture = obtenerFixture(item);
  const teams = obtenerTeams(item);

  const home = equipoLocal(teams);
  const away = equipoVisitante(teams);

  const status = estadoFixture(fixture);

  const nombreHome = nombreEquipo(home);
  const nombreAway = nombreEquipo(away);

  const logoHome = logoEquipo(home);
  const logoAway = logoEquipo(away);

  const minutoJuego = minuto(status);

  let estadoTexto = formatoHora(fechaFixture(fixture));

  if(enVivo){

    const corto = String(estadoCorto(status)).toUpperCase();

    if(corto === "HT"){
      estadoTexto = "DESCANSO";
    }else if(minutoJuego !== null){
      estadoTexto = `${minutoJuego}'`;
    }else{
      estadoTexto = "EN VIVO";
    }

  }else{

    const largo = String(estadoLargo(status)).toLowerCase();

    if(
      largo.includes("finished") ||
      largo.includes("finalizado") ||
      estadoCorto(status) === "FT"
    ){
      estadoTexto = "FINAL";
    }

  }

  const eventos = valor(item,["events","eventos"],[]);

  let eventosHTML="";

  if(enVivo && Array.isArray(eventos) && eventos.length){

    const ultimos = eventos.slice(-4);

    eventosHTML = `
      <div class="events">
        ${ultimos.map(e=>{

          const tiempo = valor(e.time,["elapsed","transcurrido"],"");
          const jugador = valor(e.player,["name","nombre"],"");
          const tipo = valor(e,["type","tipo"],"");
          const detalle = valor(e,["detail","detalle"],"");

          let icono="•";

          const t = String(tipo).toLowerCase();
          const d = String(detalle).toLowerCase();

          if(t.includes("goal") || t.includes("gol")){
            icono="⚽";
          }else if(t.includes("card") || t.includes("tarjeta")){
            icono="🟨";
          }else if(t.includes("subst") || t.includes("sustit")){
            icono="🔄";
          }

          return `<div>${icono} ${tiempo ? tiempo+"' " : ""}${jugador}${detalle ? " — "+detalle : ""}</div>`;

        }).join("")}
      </div>
    `;

  }

  return `
    <div class="match">

      <div class="match-top">

        <span class="${enVivo ? "status-live" : "status-finished"}">
          ${enVivo ? "🔴 EN VIVO" : "⚽ PARTIDO"}
        </span>

        <span>${estadoTexto}</span>

      </div>

      <div class="teams">

        <div class="team">
          ${logoHome ? `<img class="team-logo" src="${logoHome}" onerror="this.style.display='none'">` : ""}
          <span>${nombreHome}</span>
        </div>

        <div class="score">
          ${marcador(item)}
        </div>

        <div class="team away">
          <span>${nombreAway}</span>
          ${logoAway ? `<img class="team-logo" src="${logoAway}" onerror="this.style.display='none'">` : ""}
        </div>

      </div>

      <div class="time">
        ${enVivo ? estadoTexto : "Hora: "+formatoHora(fechaFixture(fixture))}
      </div>

      ${eventosHTML}

    </div>
  `;

}

function crearGrupos(lista, enVivo=false){

  if(!Array.isArray(lista) || lista.length===0){

    return `
      <div class="no-games">
        ⚽<br><br>
        No hay partidos disponibles en esta sección.
      </div>
    `;

  }

  const grupos = agrupar(lista);

  let html="";

  Object.keys(grupos).sort().forEach(pais=>{

    const ligas = grupos[pais];

    let total=0;

    Object.values(ligas).forEach(l=>{
      total += l.partidos.length;
    });

    html += `
      <div class="country">

        <div class="country-title" onclick="toggleElemento(this.nextElementSibling)">

          <span>🌎 ${pais}</span>
          <span>${total} partidos ▼</span>

        </div>

        <div class="country-body">
    `;

    Object.keys(ligas).forEach(liga=>{

      const info = ligas[liga];

      html += `
        <div class="league">

          <div class="league-title"
               onclick="toggleElemento(this.nextElementSibling)">

            <div class="league-name">

              ${
                info.logo
                ?
                `<img class="league-logo"
                      src="${info.logo}"
                      onerror="this.style.display='none'">`
                :
                "🏆"
              }

              <span>${liga}</span>

            </div>

            <span>${info.partidos.length} ▼</span>

          </div>

          <div class="matches">

            ${info.partidos
              .map(p=>crearPartido(p,enVivo))
              .join("")
            }

          </div>

        </div>
      `;

    });

    html += `
        </div>
      </div>
    `;

  });

  return html;

}

function toggleElemento(elemento){

  if(!elemento) return;

  if(
    elemento.style.display === "none" ||
    elemento.style.display === ""
  ){
    elemento.style.display="block";
  }else{
    elemento.style.display="none";
  }

}

function mostrarSeccion(id,boton){

  document.querySelectorAll(".section")
    .forEach(s=>s.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".tab")
    .forEach(b=>b.classList.remove("active"));

  boton.classList.add("active");

}

async function cargarPartidos(){

  const status = document.getElementById("status");

  status.innerHTML="🔄 Actualizando partidos...";

  try{

    const respuesta = await fetch(
      API_URL + "?t=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!respuesta.ok){
      throw new Error("HTTP "+respuesta.status);
    }

    const data = await respuesta.json();

    console.log("RESPUESTA API:",data);

    const enVivo = valor(
      data,
      ["enVivo","live"],
      []
    );

    const hoy = valor(
      data,
      ["partidosHoy","hoy"],
      []
    );

    const manana = valor(
      data,
      ["partidosManana","manana","proximos"],
      []
    );

    const totalLive = Number(
      valor(data,["cantidadEnVivo"],enVivo.length)
    );

    const totalHoy = Number(
      valor(data,["cantidadHoy"],hoy.length)
    );

    const totalManana = Number(
      valor(data,["cantidadManana"],manana.length)
    );

    document.getElementById("live").innerHTML =
      crearGrupos(enVivo,true);

    document.getElementById("today").innerHTML =
      crearGrupos(hoy,false);

    document.getElementById("next").innerHTML =
      crearGrupos(manana,false);

    status.innerHTML =
      `🟢 API CONECTADA — 🔴 ${totalLive} en vivo · 📅 ${totalHoy} hoy · ⏭️ ${totalManana} próximos`;

  }catch(error){

    console.error(error);

    status.innerHTML =
      "🔴 Error conectando con la API";

    document.getElementById("live").innerHTML =
      `<div class="no-games">
        ❌ No se pudieron cargar los partidos.<br><br>
        Comprueba nuevamente en unos segundos.
      </div>`;

    document.getElementById("today").innerHTML =
      `<div class="no-games">❌ No se pudieron cargar los partidos.</div>`;

    document.getElementById("next").innerHTML =
      `<div class="no-games">❌ No se pudieron cargar los próximos partidos.</div>`;

  }

}

cargarPartidos();

setInterval(cargarPartidos,60000);

</script>

</body>
  </html>
