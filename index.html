<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOGER ATENCIO SPORT</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #061b12;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #0b6b3a, #063b25);
      padding: 18px 10px;
      text-align: center;
      border-bottom: 2px solid #19a463;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #b8f5d4;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      background: #04140d;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .tab {
      flex: 1;
      border: 0;
      padding: 12px 5px;
      border-radius: 8px;
      background: #123d2a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #0ca45a;
    }

    .estado {
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #0b2d1e;
      color: #b9f5d3;
      font-size: 13px;
      text-align: center;
    }

    .contenedor {
      padding: 0 10px 30px;
    }

    .pais {
      margin-top: 12px;
      background: #0b3423;
      border: 1px solid #176441;
      border-radius: 10px;
      overflow: hidden;
    }

    .pais-titulo {
      padding: 13px;
      background: #10492f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pais-contenido {
      padding: 7px;
    }

    .liga {
      margin: 7px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #071f14;
      border: 1px solid #164d34;
    }

    .liga-titulo {
      padding: 11px;
      background: #0d3d29;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .liga-info {
      color: #9ce7bb;
      font-size: 12px;
    }

    .partidos {
      display: none;
      padding: 5px;
    }

    .partidos.abierto {
      display: block;
    }

    .partido {
      background: #0a281b;
      border-bottom: 1px solid #164631;
      padding: 10px 7px;
    }

    .partido:last-child {
      border-bottom: 0;
    }

    .hora {
      text-align: center;
      color: #8ce5ae;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .equipos {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .equipo {
      width: 38%;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .equipo img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
      margin: 0 auto 5px;
    }

    .marcador {
      width: 20%;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }

    .vivo {
      color: #ff5757;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .pred-btn {
      display: block;
      width: 100%;
      margin-top: 9px;
      padding: 9px;
      border: 0;
      border-radius: 7px;
      background: #174f35;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .pred-btn:disabled {
      opacity: 0.7;
    }

    .prediccion {
      display: none;
      margin-top: 8px;
      padding: 9px;
      background: #061810;
      border-radius: 7px;
      border: 1px solid #205d3e;
    }

    .prediccion.visible {
      display: block;
    }

    .pred-linea {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 2px;
      border-bottom: 1px solid #153d2b;
      font-size: 13px;
    }

    .pred-linea:last-child {
      border-bottom: 0;
    }

    .porcentaje {
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 5px;
    }

    .verde {
      background: #087a3d;
      color: white;
    }

    .amarillo {
      background: #a17c00;
      color: white;
    }

    .rojo {
      background: #8b2222;
      color: white;
    }

    .cargando {
      text-align: center;
      padding: 35px 15px;
      color: #9de8bb;
    }

    .error {
      background: #421b1b;
      border: 1px solid #8c3c3c;
      color: #ffb6b6;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
    }

    .vacio {
      text-align: center;
      padding: 25px 10px;
      color: #91b6a0;
    }

    .flecha {
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="cambiarTab('vivo', this)">🔴 EN VIVO</button>
  <button class="tab" onclick="cambiarTab('hoy', this)">📅 HOY</button>
  <button class="tab" onclick="cambiarTab('manana', this)">⏭️ PRÓXIMOS</button>
</div>

<div id="estado" class="estado">
  Conectando con los partidos...
</div>

<div id="contenedor" class="contenedor">
  <div class="cargando">⚽ Cargando partidos...</div>
</div>

<script>

  let datos = {
    vivo: [],
    hoy: [],
    manana: []
  };

  let tabActual = "vivo";

  const ligasPrediccion = [
    "La Liga",
    "Copa del Rey",

    "Premier League",
    "Championship",
    "League One",
    "FA Cup",

    "Serie A",

    "Bundesliga",
    "2. Bundesliga",

    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Europa Conference League",

    "Brasileirão",
    "Copa Libertadores",
    "Copa Sudamericana",

    "Scottish Premiership",
    "Belgian Pro League",
    "Superliga",
    "Eliteserien",
    "Super League"
  ];

  const prioridadPaises = [
    "España",
    "England",
    "Inglaterra",
    "Italia",
    "Germany",
    "Alemania",
    "France",
    "Francia",
    "Europe",
    "Europa",
    "Brazil",
    "Brasil",
    "Scotland",
    "Escocia",
    "Belgium",
    "Bélgica",
    "Denmark",
    "Dinamarca",
    "Norway",
    "Noruega",
    "Switzerland",
    "Suiza"
  ];

  function escapar(texto) {
    if (texto === null || texto === undefined) return "";

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function obtenerNombrePais(partido) {
    return partido?.league?.country ||
           partido?.country ||
           "Otros países";
  }

  function obtenerNombreLiga(partido) {
    return partido?.league?.name ||
           "Otras ligas";
  }

  function obtenerFecha(partido) {
    return partido?.fixture?.date || null;
  }

  function obtenerId(partido) {
    return partido?.fixture?.id ||
           partido?.id ||
           null;
  }

  function nombreEquipo(partido, lado) {
    return partido?.teams?.[lado]?.name || "Equipo";
  }

  function logoEquipo(partido, lado) {
    return partido?.teams?.[lado]?.logo || "";
  }

  function estadoPartido(partido) {
    return partido?.fixture?.status?.short || "";
  }

  function resultado(partido, lado) {
    return partido?.goals?.[lado] ?? null;
  }

  function esLigaPrediccion(nombreLiga) {
    return ligasPrediccion.some(
      liga =>
        String(liga).toLowerCase() ===
        String(nombreLiga).toLowerCase()
    );
  }

  function ordenarPaises(a, b) {

    const ia = prioridadPaises.findIndex(
      p => p.toLowerCase() === a.toLowerCase()
    );

    const ib = prioridadPaises.findIndex(
      p => p.toLowerCase() === b.toLowerCase()
    );

    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;

    return a.localeCompare(b);
  }

  function cambiarTab(tab, boton) {

    tabActual = tab;

    document.querySelectorAll(".tab").forEach(
      b => b.classList.remove("active")
    );

    boton.classList.add("active");

    mostrarPartidos();
  }

  function abrirCerrar(elemento) {

    const contenido = elemento.nextElementSibling;

    const flecha = elemento.querySelector(".flecha");

    if (!contenido) return;

    contenido.classList.toggle("abierto");

    if (flecha) {
      flecha.textContent =
        contenido.classList.contains("abierto")
          ? "▲"
          : "▼";
    }
  }

  function colorPorcentaje(valor) {

    const numero = parseFloat(
      String(valor).replace("%", "")
    );

    if (isNaN(numero)) return "";

    if (numero >= 70) return "verde";

    if (numero >= 50) return "amarillo";

    return "rojo";
  }

  function porcentajeHTML(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ""
    ) {
      return `<span class="porcentaje">—</span>`;
    }

    return `
      <span class="porcentaje ${colorPorcentaje(valor)}">
        ${escapar(valor)}%
      </span>
    `;
  }

  /*
    NUEVA FUNCIÓN DE PREDICCIÓN

    API-Football responde:

    {
      response: [
        {
          predictions: {
            percent: {
              home: "...",
              draw: "...",
              away: "..."
            }
          }
        }
      ]
    }
  */

  async function verPrediccion(id, boton) {

    const caja =
      document.getElementById("pred-" + id);

    if (!caja) return;

    if (caja.classList.contains("visible")) {

      caja.classList.remove("visible");

      boton.textContent =
        "🔮 VER PREDICCIÓN";

      return;
    }

    boton.disabled = true;

    boton.textContent =
      "⏳ CARGANDO...";

    caja.classList.add("visible");

    caja.innerHTML = `
      <div style="text-align:center;padding:8px;">
        🔮 Consultando datos...
      </div>
    `;

    try {

      const controlador =
        new AbortController();

      const temporizador =
        setTimeout(
          () => controlador.abort(),
          20000
        );

      const respuesta =
        await fetch(
          "/api/football?prediction=" +
          encodeURIComponent(id) +
          "&t=" +
          Date.now(),
          {
            cache: "no-store",
            signal: controlador.signal
          }
        );

      clearTimeout(temporizador);

      if (!respuesta.ok) {
        throw new Error(
          "Error HTTP " + respuesta.status
        );
      }

      const data =
        await respuesta.json();

      if (!data) {
        throw new Error(
          "La API no devolvió datos."
        );
      }

      if (data.success !== true) {

        const error =
          data?.errors?.requests ||
          data?.errors?.message ||
          data?.message ||
          "No hay predicción disponible.";

        throw new Error(error);
      }

      /*
        AQUÍ ESTABA EL ERROR.

        Ahora buscamos response[0].
      */

      let prediccion = null;

      if (
        Array.isArray(data.response) &&
        data.response.length > 0
      ) {
        prediccion =
          data.response[0]?.predictions ||
          null;
      }

      /*
        Por compatibilidad, también aceptamos
        diferentes formatos que pudiera devolver
        nuestro backend.
      */

      if (!prediccion) {
        prediccion =
          data.predictions ||
          data.response?.predictions ||
          null;
      }

      if (!prediccion) {

        caja.innerHTML = `
          <div style="text-align:center;color:#ffcc80;">
            ⚠️ Este partido no tiene
            predicción disponible.
          </div>
        `;

        boton.textContent =
          "🔮 VER PREDICCIÓN";

        boton.disabled = false;

        return;
      }

      const percent =
        prediccion.percent || {};

      const local =
        percent.home ??
        null;

      const empate =
        percent.draw ??
        null;

      const visitante =
        percent.away ??
        null;

      /*
        BTTS
      */

      let btts = null;

      if (
        prediccion.btts &&
        typeof prediccion.btts === "object"
      ) {

        btts =
          prediccion.btts.yes ??
          prediccion.btts.Yes ??
          prediccion.btts.YES ??
          null;
      }

      /*
        UNDER / OVER

        API-Football proporciona normalmente
        una predicción general como:

        "Over 2.5"

        No vamos a inventar un porcentaje
        para mercados que la API no entregue.
      */

      let overUnder =
        prediccion.under_over ??
        null;

      let consejo =
        prediccion.advice ??
        null;

      let ganador =
        prediccion.winner?.name ??
        null;

      caja.innerHTML = `

        <div class="pred-linea">
          <span>🏠 Local</span>
          ${porcentajeHTML(local)}
        </div>

        <div class="pred-linea">
          <span>🤝 Empate</span>
          ${porcentajeHTML(empate)}
        </div>

        <div class="pred-linea">
          <span>✈️ Visitante</span>
          ${porcentajeHTML(visitante)}
        </div>

        <div class="pred-linea">
          <span>⚽ BTTS</span>
          ${porcentajeHTML(btts)}
        </div>

        <div class="pred-linea">
          <span>⚽ Under / Over</span>
          <strong>
            ${escapar(overUnder || "—")}
          </strong>
        </div>

        <div class="pred-linea">
          <span>🏆 Ganador previsto</span>
          <strong>
            ${escapar(ganador || "—")}
          </strong>
        </div>

        <div class="pred-linea">
          <span>💡 Consejo</span>
          <strong style="text-align:right;max-width:60%;">
            ${escapar(consejo || "—")}
          </strong>
        </div>

      `;

      boton.textContent =
        "🔽 OCULTAR PREDICCIÓN";

    } catch (error) {

      console.error(
        "ERROR PREDICCIÓN:",
        error
      );

      caja.innerHTML = `
        <div style="text-align:center;color:#ffb6b6;">
          ❌ No se pudo cargar la predicción.
          <br><br>
          <small>
            ${escapar(error.message)}
          </small>
        </div>
      `;

      boton.textContent =
        "🔄 INTENTAR DE NUEVO";

    } finally {

      boton.disabled = false;
    }
  }

  function crearPartido(partido) {

    const id =
      obtenerId(partido);

    const local =
      nombreEquipo(partido, "home");

    const visitante =
      nombreEquipo(partido, "away");

    const logoLocal =
      logoEquipo(partido, "home");

    const logoVisitante =
      logoEquipo(partido, "away");

    const status =
      estadoPartido(partido);

    const golesLocal =
      resultado(partido, "home");

    const golesVisitante =
      resultado(partido, "away");

    let fechaTexto = "";

    const fecha =
      obtenerFecha(partido);

    if (fecha) {

      try {

        fechaTexto =
          new Date(fecha)
          .toLocaleTimeString(
            "es-ES",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      } catch {}
    }

    const estaVivo =
      tabActual === "vivo" ||
      [
        "1H",
        "2H",
        "HT",
        "ET",
        "BT",
        "P",
        "LIVE"
      ].includes(status);

    const liga =
      obtenerNombreLiga(partido);

    const botonPrediccion =
      esLigaPrediccion(liga) && id
        ? `

          <button
            class="pred-btn"
            onclick="verPrediccion(
              ${Number(id)},
              this
            )"
          >
            🔮 VER PREDICCIÓN
          </button>

          <div
            class="prediccion"
            id="pred-${Number(id)}"
          ></div>

        `
        : "";

    return `

      <div class="partido">

        <div class="hora">

          ${
            estaVivo
              ? `
                <div class="vivo">
                  🔴 EN VIVO
                  ${status ? " • " + escapar(status) : ""}
                </div>
              `
              : ""
          }

          ${escapar(fechaTexto)}

        </div>

        <div class="equipos">

          <div class="equipo">

            ${
              logoLocal
                ? `
                  <img
                    src="${escapar(logoLocal)}"
                    alt=""
                  >
                `
                : "⚽"
            }

            ${escapar(local)}

          </div>

          <div class="marcador">

            ${
              golesLocal !== null &&
              golesVisitante !== null
                ? `
                  ${escapar(golesLocal)}
                  -
                  ${escapar(golesVisitante)}
                `
                : "VS"
            }

          </div>

          <div class="equipo">

            ${
              logoVisitante
                ? `
                  <img
                    src="${escapar(logoVisitante)}"
                    alt=""
                  >
                `
                : "⚽"
            }

            ${escapar(visitante)}

          </div>

        </div>

        ${botonPrediccion}

      </div>

    `;
  }

  function mostrarPartidos() {

    const contenedor =
      document.getElementById(
        "contenedor"
      );

    let partidos = [];

    if (tabActual === "vivo") {
      partidos =
        datos.vivo || [];
    }

    if (tabActual === "hoy") {
      partidos =
        datos.hoy || [];
    }

    if (tabActual === "manana") {
      partidos =
        datos.manana || [];
    }

    if (!partidos.length) {

      contenedor.innerHTML = `

        <div class="vacio">

          ${
            tabActual === "vivo"
              ? "🔴 No hay partidos en vivo en este momento."
              : "⚽ No hay partidos disponibles."
          }

        </div>

      `;

      return;
    }

    const paises = {};

    partidos.forEach(partido => {

      const pais =
        obtenerNombrePais(partido);

      const liga =
        obtenerNombreLiga(partido);

      if (!paises[pais]) {
        paises[pais] = {};
      }

      if (!paises[pais][liga]) {
        paises[pais][liga] = [];
      }

      paises[pais][liga].push(
        partido
      );
    });

    let html = "";

    Object.keys(paises)
      .sort(ordenarPaises)
      .forEach(pais => {

        const ligas =
          paises[pais];

        html += `

          <div class="pais">

            <div
              class="pais-titulo"
              onclick="abrirCerrar(this)"
            >

              <span>
                🌍 ${escapar(pais)}
              </span>

              <span class="flecha">
                ▼
              </span>

            </div>

            <div class="pais-contenido">

        `;

        Object.keys(ligas)
          .sort(
            (a, b) =>
              a.localeCompare(b)
          )
          .forEach(liga => {

            const lista =
              ligas[liga];

            html += `

              <div class="liga">

                <div
                  class="liga-titulo"
                  onclick="abrirCerrar(this)"
                >

                  <span>

                    ⚽ ${escapar(liga)}

                    <span class="liga-info">
                      (${lista.length})
                    </span>

                  </span>

                  <span class="flecha">
                    ▼
                  </span>

                </div>

                <div class="partidos">

                  ${lista
                    .map(crearPartido)
                    .join("")}

                </div>

              </div>

            `;
          });

        html += `

            </div>

          </div>

        `;
      });

    contenedor.innerHTML =
      html;
  }

  async function cargarPartidos() {

    const contenedor =
      document.getElementById(
        "contenedor"
      );

    const estado =
      document.getElementById(
        "estado"
      );

    contenedor.innerHTML = `

      <div class="cargando">
        ⚽ C
