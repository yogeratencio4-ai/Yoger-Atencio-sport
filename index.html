<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YOGER ATENCIO SPORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #06100a;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0b1d11;
      padding: 20px 15px;
      text-align: center;
      border-bottom: 2px solid #16c763;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 7px 0 0;
      color: #16c763;
      font-weight: bold;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .top h2 {
      margin: 0;
      font-size: 19px;
    }

    .refresh {
      background: #16c763;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .match {
      background: #102017;
      border: 1px solid #1e4930;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .league {
      color: #86e7a8;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 8px;
    }

    .team {
      width: 40%;
      font-weight: bold;
      font-size: 14px;
    }

    .team img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .score {
      min-width: 60px;
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      color: #9ca89f;
    }

    .live {
      color: #ff3b30;
      font-weight: bold;
    }

    .video-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #16c763;
      color: #001b09;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .video-button:disabled {
      background: #37433b;
      color: #9aa39d;
      cursor: default;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px 10px;
      color: #aeb9b1;
    }

    .error {
      color: #ff7b72;
    }

    .video-box {
      display: none;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .video-title {
      background: #102017;
      padding: 13px;
      font-weight: bold;
    }

    #videoPlayer {
      width: 100%;
    }

    #videoPlayer iframe {
      width: 100%;
      min-height: 420px;
      border: 0;
      display: block;
    }

    @media (max-width: 600px) {
      #videoPlayer iframe {
        min-height: 230px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>🔴 FÚTBOL EN VIVO</p>
</header>

<div class="container">

  <div id="videoBox" class="video-box">
    <div id="videoTitle" class="video-title">
      ▶️ Reproduciendo
    </div>

    <div id="videoPlayer"></div>
  </div>

  <div class="top">
    <h2>📺 Partidos de hoy</h2>

    <button
      class="refresh"
      onclick="cargarPartidos()"
    >
      ↻ Actualizar
    </button>
  </div>

  <div id="matches">
    <div class="loading">
      ⏳ Cargando partidos...
    </div>
  </div>

</div>

<script>

  let videosScoreBat = [];

  /*
   * CARGAR PARTIDOS DE API-FOOTBALL
   */

  async function cargarPartidos() {

    const contenedor =
      document.getElementById("matches");

    contenedor.innerHTML =
      '<div class="loading">⏳ Cargando partidos...</div>';

    try {

      const respuesta =
        await fetch("/api/football");

      if (!respuesta.ok) {
        throw new Error("API Football error");
      }

      const data =
        await respuesta.json();

      if (
        !data.response ||
        data.response.length === 0
      ) {

        contenedor.innerHTML =
          '<div class="empty">No hay partidos disponibles.</div>';

        return;
      }

      /*
       * Intentamos cargar también
       * los vídeos gratuitos disponibles.
       */

      await cargarVideos();

      let partidos = data.response;

      partidos.sort((a, b) => {

        const liveA =
          esEnVivo(a.fixture.status.short)
            ? 1
            : 0;

        const liveB =
          esEnVivo(b.fixture.status.short)
            ? 1
            : 0;

        return liveB - liveA;

      });

      contenedor.innerHTML = "";

      partidos.forEach(partido => {

        const fixture =
          partido.fixture;

        const home =
          partido.teams.home;

        const away =
          partido.teams.away;

        const league =
          partido.league;

        const enVivo =
          esEnVivo(
            fixture.status.short
          );

        let marcador = "";

        if (
          fixture.status.short === "NS"
        ) {

          marcador =
            new Date(
              fixture.date
            ).toLocaleTimeString(
              "es-VE",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );

        } else {

          marcador =
            `${partido.goals.home ?? 0} - ${partido.goals.away ?? 0}`;

        }

        let estado =
          fixture.status.long || "";

        if (enVivo) {

          estado =
            `🔴 EN VIVO ${
              fixture.status.elapsed
                ? fixture.status.elapsed + "'"
                : ""
            }`;

        }

        const video =
          buscarVideo(
            home.name,
            away.name
          );

        const card =
          document.createElement("div");

        card.className = "match";

        card.innerHTML = `

          <div class="league">
            ${escapeHTML(league.name)}
          </div>

          <div class="teams">

            <div class="team">

              ${
                home.logo
                  ? `<img src="${home.logo}" alt="">`
                  : ""
              }

              ${escapeHTML(home.name)}

            </div>

            <div class="score">

              ${marcador}

              <div class="status ${
                enVivo ? "live" : ""
              }">

                ${escapeHTML(estado)}

              </div>

            </div>

            <div class="team">

              ${
                away.logo
                  ? `<img src="${away.logo}" alt="">`
                  : ""
              }

              ${escapeHTML(away.name)}

            </div>

          </div>

          ${
            video
              ? `
                <button
                  class="video-button"
                  onclick='reproducirVideo(${JSON.stringify(video.embed)}, ${JSON.stringify(home.name + " vs " + away.name)})'
                >
                  ▶️ VER VIDEO
                </button>
              `
              : ""
          }

        `;

        contenedor.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      contenedor.innerHTML = `
        <div class="error">
          ❌ No se pudieron cargar los partidos.
          <br><br>
          Pulsa "Actualizar".
        </div>
      `;

    }

  }


  /*
   * INTENTAR OBTENER VIDEOS GRATIS
   */

  async function cargarVideos() {

    videosScoreBat = [];

    try {

      const respuesta =
        await fetch(
          "https://www.scorebat.com/video-api/"
        );

      if (!respuesta.ok) {
        return;
      }

      const data =
        await respuesta.json();

      if (Array.isArray(data)) {

        videosScoreBat = data;

      } else if (
        data &&
        Array.isArray(data.response)
      ) {

        videosScoreBat =
          data.response;

      }

    } catch (error) {

      console.log(
        "Feed gratuito no disponible:",
        error
      );

    }

  }


  /*
   * BUSCAR EL VIDEO DEL PARTIDO
   */

  function buscarVideo(
    local,
    visitante
  ) {

    if (
      !videosScoreBat ||
      videosScoreBat.length === 0
    ) {
      return null;
    }

    const normalLocal =
      normalizar(local);

    const normalVisitante =
      normalizar(visitante);

    for (
      const partido of videosScoreBat
    ) {

      const home =
        normalizar(
          partido.homeTeam?.name || ""
        );

      const away =
        normalizar(
          partido.awayTeam?.name || ""
        );

      const titulo =
        normalizar(
          partido.title || ""
        );

      const coincideEquipos =
        (
          home.includes(normalLocal) ||
          normalLocal.includes(home)
        ) &&
        (
          away.includes(normalVisitante) ||
          normalVisitante.includes(away)
        );

      const coincideTitulo =
        titulo.includes(normalLocal) &&
        titulo.includes(normalVisitante);

      if (
        coincideEquipos ||
        coincideTitulo
      ) {

        if (
          partido.embed
        ) {

          return {
            embed: partido.embed
          };

        }

        if (
          partido.videos &&
          partido.videos.length > 0 &&
          partido.videos[0].embed
        ) {

          return {
            embed:
              partido.videos[0].embed
          };

        }

      }

    }

    return null;

  }


  /*
   * MOSTRAR REPRODUCTOR
   */

  function reproducirVideo(
    embed,
    titulo
  ) {

    const box =
      document.getElementById(
        "videoBox"
      );

    const player =
      document.getElementById(
        "videoPlayer"
      );

    const title =
      document.getElementById(
        "videoTitle"
      );

    title.textContent =
      "▶️ " + titulo;

    player.innerHTML =
      embed;

    box.style.display =
      "block";

    box.scrollIntoView({
      behavior: "smooth"
    });

  }


  /*
   * ESTADOS EN VIVO
   */

  function esEnVivo(status) {

    return [
      "1H",
      "2H",
      "HT",
      "ET",
      "BT",
      "P",
      "SUSP",
      "INT",
      "LIVE"
    ].includes(status);

  }


  /*
   * NORMALIZAR NOMBRES
   */

  function normalizar(texto) {

    return String(texto)
      .toLowerCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .replace(
        /[^a-z0-9]/g,
        ""
      );

  }


  /*
   * SEGURIDAD BÁSICA PARA TEXTO
   */

  function escapeHTML(texto) {

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * INICIAR
   */

  cargarPartidos();

</script>

</body>
</html>
