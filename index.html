<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>YOGER ATENCIO SPORT</title>  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07140d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0b2417;
      padding: 20px 15px;
      text-align: center;
      border-bottom: 1px solid #1c4d31;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    header p {
      color: #55ff91;
      font-size: 14px;
      font-weight: bold;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .estado {
      text-align: center;
      background: #0b2417;
      border: 1px solid #1c4d31;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .estado span {
      color: #55ff91;
      font-weight: bold;
    }

    .actualizando {
      color: #aaa;
      font-size: 12px;
      margin-top: 7px;
    }

    .error {
      background: #351010;
      border: 1px solid #8b3030;
      color: #ffaaaa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      word-break: break-word;
    }

    /* ==============================
       SECCIONES
       ============================== */

    .bloque-principal {
      margin-bottom: 18px;
    }

    .titulo-principal {
      background: #0b2417;
      border: 1px solid #1c4d31;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      list-style: none;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.2s;
    }

    .titulo-principal:hover {
      background: #10321f;
    }

    .titulo-principal::-webkit-details-marker {
      display: none;
    }

    .titulo-principal::after {
      content: "▸";
      color: #55ff91;
      font-size: 20px;
      transition: 0.2s;
    }

    details[open] > .titulo-principal::after {
      content: "▾";
    }

    .contenido-principal {
      padding: 10px 0 0 0;
    }

    /* ==============================
       PAÍSES
       ============================== */

    .pais {
      margin-bottom: 10px;
    }

    .titulo-pais {
      background: #091c11;
      border: 1px solid #245437;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      list-style: none;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .titulo-pais::-webkit-details-marker {
      display: none;
    }

    .titulo-pais::after {
      content: "＋";
      color: #55ff91;
    }

    .pais[open] > .titulo-pais::after {
      content: "−";
    }

    .contenido-pais {
      padding: 8px 0 5px 10px;
    }

    /* ==============================
       LIGAS
       ============================== */

    .liga-bloque {
      margin-bottom: 8px;
    }

    .titulo-liga {
      background: #0b2417;
      border: 1px solid #1c4d31;
      border-radius: 9px;
      padding: 12px;
      cursor: pointer;
      list-style: none;
      color: #55ff91;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .titulo-liga::-webkit-details-marker {
      display: none;
    }

    .titulo-liga::after {
      content: "＋";
      color: #aaa;
    }

    .liga-bloque[open] > .titulo-liga::after {
      content: "−";
    }

    .partidos {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
    }

    /* ==============================
       PARTIDO
       ============================== */

    .partido {
      background: #07140d;
      border: 1px solid #1c4d31;
      border-radius: 10px;
      padding: 13px;
    }

    .equipos {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .equipo {
      width: 40%;
      text-align: center;
    }

    .marcador {
      width: 20%;
      text-align: center;
      font-size: 17px;
      color: #55ff91;
      white-space: nowrap;
    }

    .hora {
      text-align: center;
      margin-top: 8px;
      color: #aaa;
      font-size: 12px;
    }

    .estado-vivo {
      display: block;
      width: fit-content;
      margin: 8px auto 0;
      background: #d90000;
      color: white;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: bold;
    }

    .vacio {
      background: #0b2417;
      border: 1px dashed #315b42;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }

    .contador {
      color: #999;
      font-size: 12px;
      margin-left: auto;
      margin-right: 10px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 15px;
      font-size: 12px;
    }

  </style></head><body><header>  <h1>⚽ YOGER ATENCIO SPORT</h1>  <p>PARTIDOS DE FÚTBOL EN VIVO</p></header><div class="contenedor">  <div class="estado">Estado:
<span id="estado">Conectando...</span>

<div
  class="actualizando"
  id="actualizando"
>
  Cargando partidos...
</div>

  </div>  <div id="error"></div>  <!-- =====================================
       FÚTBOL EN VIVO
       ===================================== -->  <details
    class="bloque-principal"
    open
  ><summary class="titulo-principal">
  🔴 PARTIDOS EN VIVO
  <span
    class="contador"
    id="contadorVivo"
  >
    0
  </span>
</summary>

<div
  class="contenido-principal"
  id="vivo"
>

  <div class="vacio">
    Buscando partidos en vivo...
  </div>

</div>

  </details>  <!-- =====================================
       PARTIDOS DE HOY
       ===================================== -->  <details
    class="bloque-principal"
    open
  ><summary class="titulo-principal">

  ⚽ PARTIDOS DE HOY

  <span
    class="contador"
    id="contadorHoy"
  >
    0
  </span>

</summary>

<div
  class="contenido-principal"
  id="hoy"
>

  <div class="vacio">
    Cargando partidos...
  </div>

</div>

  </details>  <!-- =====================================
       PRÓXIMOS PARTIDOS
       ===================================== -->  <details
    class="bloque-principal"
    open
  ><summary class="titulo-principal">

  📅 PRÓXIMOS PARTIDOS

  <span
    class="contador"
    id="contadorManana"
  >
    0
  </span>

</summary>

<div
  class="contenido-principal"
  id="manana"
>

  <div class="vacio">
    Cargando próximos partidos...
  </div>

</div>

  </details></div><footer>YOGER ATENCIO SPORT

</footer><script>

  /* =========================================
     ELEMENTOS
     ========================================= */

  const estado =
    document.getElementById("estado");

  const actualizando =
    document.getElementById("actualizando");

  const errorBox =
    document.getElementById("error");

  const vivoBox =
    document.getElementById("vivo");

  const hoyBox =
    document.getElementById("hoy");

  const mananaBox =
    document.getElementById("manana");

  const contadorVivo =
    document.getElementById("contadorVivo");

  const contadorHoy =
    document.getElementById("contadorHoy");

  const contadorManana =
    document.getElementById("contadorManana");


  /* =========================================
     ORDEN DE PAÍSES
     ========================================= */

  const ordenPaises = [

    "España",
    "Inglaterra",
    "Italia",
    "Alemania",
    "Francia",
    "Brasil",
    "Argentina",
    "Países Bajos",
    "Portugal",
    "Bélgica",
    "Turquía",
    "Arabia Saudita",
    "Estados Unidos",
    "México",
    "Colombia",
    "Chile",
    "Perú",
    "Austria",
    "Suiza",
    "Dinamarca",
    "Escocia",
    "Grecia",
    "Noruega",
    "Suecia",
    "Polonia",
    "Croacia",
    "Serbia",
    "Rumania",
    "Bulgaria",
    "Chipre",
    "Venezuela"

  ];


  /* =========================================
     ORDEN DE COMPETICIONES
     ========================================= */

  const ordenLigas = [

    "Premier League",
    "La Liga",
    "Serie A",
    "Bundesliga",
    "Ligue 1",
    "Championship",
    "Eredivisie",
    "Primeira Liga",
    "Serie B",
    "LaLiga Hypermotion",
    "Copa del Rey",
    "FA Cup",
    "EFL Cup",
    "Europa League",
    "Champions League",
    "Conference League"

  ];


  /* =========================================
     NORMALIZAR PAÍS
     ========================================= */

  function obtenerPais(partido) {

    const league =
      partido.league || {};

    if (league.country) {
      return league.country;
    }

    return "Otros";

  }


  /* =========================================
     NORMALIZAR LIGA
     ========================================= */

  function obtenerLiga(partido) {

    const league =
      partido.league || {};

    return league.name || "Fútbol";

  }


  /* =========================================
     HORA
     ========================================= */

  function formatoHora(fecha) {

    if (!fecha) {
      return "--:--";
    }

    const d =
      new Date(fecha);

    if (isNaN(d.getTime())) {
      return "--:--";
    }

    return d.toLocaleTimeString(
      "es-ES",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  /* =========================================
     TARJETA PARTIDO
     ========================================= */

  function crearPartido(
    partido,
    esVivo = false
  ) {

    if (
      !partido ||
      !partido.fixture
    ) {
      return "";
    }

    const fixture =
      partido.fixture;

    const equipos =
      partido.teams || {};

    const goles =
      partido.goals || {};

    const status =
      fixture.status || {};

    const local =
      equipos.home &&
      equipos.home.name
        ? equipos.home.name
        : "Local";

    const visitante =
      equipos.away &&
      equipos.away.name
        ? equipos.away.name
        : "Visitante";


    let marcador = "VS";


    if (
      goles.home !== null &&
      goles.home !== undefined &&
      goles.away !== null &&
      goles.away !== undefined
    ) {

      marcador =
        `${goles.home} - ${goles.away}`;

    }


    let tiempo = "";


    if (esVivo) {

      const minuto =
        status.elapsed !== null &&
        status.elapsed !== undefined
          ? ` ${status.elapsed}'`
          : "";

      tiempo = `
        <div class="estado-vivo">
          🔴 EN VIVO${minuto}
        </div>
      `;

    } else {

      tiempo = `
        <div class="hora">
          🕐 ${formatoHora(fixture.date)}
        </div>
      `;

    }


    return `

      <div class="partido">

        <div class="equipos">

          <div class="equipo">
            ${local}
          </div>

          <div class="marcador">
            ${marcador}
          </div>

          <div class="equipo">
            ${visitante}
          </div>

        </div>

        ${tiempo}

      </div>

    `;

  }


  /* =========================================
     ORDENAR
     ========================================= */

  function indicePais(nombre) {

    const index =
      ordenPaises.indexOf(nombre);

    return index === -1
      ? 999
      : index;

  }


  function indiceLiga(nombre) {

    const index =
      ordenLigas.indexOf(nombre);

    return index === -1
      ? 999
      : index;

  }


  /* =========================================
     AGRUPAR
     ========================================= */

  function agruparPartidos(lista) {

    const paises = {};


    lista.forEach(partido => {

      const pais =
        obtenerPais(partido);

      const liga =
        obtenerLiga(partido);


      if (!paises[pais]) {
        paises[pais] = {};
      }


      if (!paises[pais][liga]) {
        paises[pais][liga] = [];
      }


      paises[pais][liga].push(partido);

    });


    return paises;

  }


  /* =========================================
     CREAR ESTRUCTURA
     ========================================= */

  function crearEstructura(
    lista,
    esVivo = false
  ) {

    if (
      !Array.isArray(lista) ||
      lista.length === 0
    ) {

      return `
        <div class="vacio">
          ${
            esVivo
              ? "No hay partidos en vivo en este momento."
              : "No hay partidos disponibles."
          }
        </div>
      `;

    }


    const grupos =
      agruparPartidos(lista);


    const paises =
      Object.keys(grupos)
        .sort(
          (a, b) =>
            indicePais(a) -
            indicePais(b)
        );


    let html = "";


    paises.forEach(
      (pais, paisIndex) => {

        const ligas =
          Object.keys(
            grupos[pais]
          ).sort(
            (a, b) =>
              indiceLiga(a) -
              indiceLiga(b)
          );


        html += `

          <details
            class="pais"
            ${paisIndex === 0 ? "open" : ""}
          >

            <summary
              class="titulo-pais"
            >

              🌍 ${pais}

            </summary>

            <div
              class="contenido-pais"
            >

        `;


        ligas.forEach(
          (liga, ligaIndex) => {

            const partidos =
              grupos[pais][liga];


            html += `

              <details
                class="liga-bloque"
                ${ligaIndex === 0 ? "open" : ""}
              >

                <summary
                  class="titulo-liga"
                >

                  🏆 ${liga}

                  <span
                    class="contador"
                  >
                    ${partidos.length}
                  </span>

                </summary>

                <div
                  class="partidos"
                >

                  ${partidos
                    .map(
                      partido =>
                        crearPartido(
                          partido,
                          esVivo
                        )
                    )
                    .join("")
                  }

                </div>

              </details>

            `;

          }
        );


        html += `

            </div>

          </details>

        `;

      }
    );


    return html;

  }


  /* =========================================
     CARGAR DATOS
     ========================================= */

  async function cargarPartidos() {

    try {

      estado.textContent =
        "Conectando...";

      errorBox.innerHTML = "";


      const respuesta =
        await fetch(
          "/api/football",
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const datos =
        await respuesta.json();


      console.log(
        "RESPUESTA API:",
        datos
      );


      if (!respuesta.ok) {

        throw new Error(
          datos.error ||
          "Error conectando con el servidor"
        );

      }


      if (
        datos.success === false
      ) {

        throw new Error(
          datos.error ||
          "La API devolvió un error"
        );

      }


      const enVivo =
        datos.enVivo || [];

      const hoy =
        datos.partidosHoy || [];

      const manana =
        datos.partidosManana || [];


      /* ==============================
         MOSTRAR
         ============================== */

      vivoBox.innerHTML =
        crearEstructura(
          enVivo,
          true
        );


      hoyBox.innerHTML =
        crearEstructura(
          hoy,
          false
        );


      mananaBox.innerHTML =
        crearEstructura(
          manana,
          false
        );


      /* ==============================
         CONTADORES
         ============================== */

      contadorVivo.textContent =
        enVivo.length;

      contadorHoy.textContent =
        hoy.length;

      contadorManana.textContent =
        manana.length;


      estado.textContent =
        "Conectado";


      actualizando.textContent =
        `Actualizado: ${
          new Date()
            .toLocaleTimeString(
              "es-ES"
            )
        }`;


    } catch (error) {

      console.error(
        "ERROR:",
        error
      );


      estado.textContent =
        "Error";


      actualizando.textContent =
        "No se pudieron cargar los partidos.";


      errorBox.innerHTML = `

        <div class="error">

          <strong>
            ⚠️ Error:
          </strong>

          <br>

          ${error.message}

        </div>

      `;


      vivoBox.innerHTML = `
        <div class="vacio">
          No se pudieron cargar los partidos.
        </div>
      `;


      hoyBox.innerHTML = `
        <div class="vacio">
          No se pudieron cargar los partidos.
        </div>
      `;


      mananaBox.innerHTML = `
        <div class="vacio">
          No se pudieron cargar los partidos.
        </div>
      `;

    }

  }


  /* =========================================
     INICIAR
     ========================================= */

  cargarPartidos();


  /* =========================================
     ACTUALIZAR CADA 60 SEGUNDOS
     ========================================= */

  setInterval(
    cargarPartidos,
    60000
  );


</script></body>
 </html>
