<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoger Atencio SPORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      background: #151515;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 2px solid #00ff66;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .live {
      color: #00ff66;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .partido {
      background: #1a1a1a;
      margin: 15px 0;
      padding: 20px;
      border-radius: 12px;
    }

    .partido h3 {
      margin-top: 0;
    }

    .boton {
      display: inline-block;
      background: #00ff66;
      color: #000;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ YOGER ATENCIO SPORT</h1>
    <p class="live">🔴 FÚTBOL EN VIVO</p>
  </header>

  <main>

    <h2>📺 Partidos de hoy</h2>

    <div class="partido">
      <h3>⚽ Partido en vivo</h3>
      <p>Transmisión disponible próximamente</p>
      <a class="boton" href="#">VER EN VIVO</a>
    </div>

    <div class="partido">
      <h3>⚽ Próximo partido</h3>
      <p>Horario y transmisión próximamente</p>
      <a class="boton" href="#">VER PARTIDO</a>
    </div>

  </main>

</body>
</html>
