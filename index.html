<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>YOGER ATENCIO SPORT</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #06100a;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0b1d11;
      padding: 20px 15px;
      text-align: center;
      border-bottom: 2px solid #16c763;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 7px 0 0;
      color: #16c763;
      font-weight: bold;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top h2 {
      margin: 0;
      font-size: 19px;
    }

    .refresh {
      background: #16c763;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      margin: 25px 0 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .live-title {
      color: #ff3b30;
    }

    .result-title {
      color: #16c763;
    }

    .next-title {
      color: #62a8ff;
    }

    .match {
      background: #102017;
      border: 1px solid #1e4930;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .league {
      color: #86e7a8;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 8px;
    }

    .team {
      width: 40%;
      font-weight: bold;
      font-size: 14px;
    }

    .team img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .score {
      min-width: 80px;
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      margin-top: 6px;
      font-size: 12px;
      color: #9ca89f;
    }

    .live {
      color: #ff3b30;
      font-weight: bold;
    }

    .finished {
      color: #16c763;
      font-weight: bold;
    }

    .upcoming {
      color: #62a8ff;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px 10px;
      color: #aeb9b1;
    }

    .error {
      color: #ff7b72;
    }

    .updated {
      text-align: center;
      color: #6f7d73;
      font-size: 11px;
      margin-top: 20px;
    }

  </style></head><body><header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>🔴 FÚTBOL EN VIVO</p>
</header><div class="container">  <div class="top">
    <h2>⚽ Fútbol</h2><button
  class="refresh"
  onclick="cargarPartidos()"
>
  ↻ Actualizar
</button>

  </div>  <!-- EN VIVO -->  <div class="section-title live-title">
    🔴 EN VIVO
  </div>  <div id="liveMatches">
    <div class="loading">
      ⏳ Buscando partidos en vivo...
    </div>
  </div>  <!-- RESULTADOS -->  <div class="section-title result-title">
    🏁 RESULTADOS
  </div>  <div id="resultsMatches">
    <div class="loading">
      ⏳ Cargando resultados...
    </div>
  </div>  <!-- PRÓXIMOS 24 HORAS -->  <div class="section-title next-title">
    📅 PRÓXIMOS 24 HORAS
  </div>  <div id="nextMatches">
    <div class="loading">
      ⏳ Cargando próximos partidos...
    </div>
  </div>  <div id="updated" class="updated"></div></div><script>

  async function cargarPartidos() {

    const liveContainer =
      document.getElementById("liveMatches");

    const resultsContainer =
      document.getElementById("resultsMatches");

    const nextContainer =
      document.getElementById("nextMatches");


    liveContainer.innerHTML =
      '<div class="loading">⏳ Buscando partidos en vivo...</div>';

    resultsContainer.innerHTML =
      '<div class="loading">⏳ Cargando resultados...</div>';

    nextContainer.innerHTML =
      '<div class="loading">⏳ Cargando próximos partidos...</div>';


    try {

      const respuesta =
        await fetch("/api/football?cache=" + Date.now());


      if (!respuesta.ok) {
        throw new Error("Error de API");
      }


      const data =
        await respuesta.json();


      const enVivo =
        data.enVivo || [];

      const resultados =
        data.resultados || [];

      const proximos =
        data.proximos || [];


      /* =========================
         EN VIVO
      ========================= */

      if (enVivo.length === 0) {

        liveContainer.innerHTML = `
          <div class="empty">
            ⚽ No hay partidos en vivo en este momento.
          </div>
        `;

      } else {

        liveContainer.innerHTML = "";

        enVivo.forEach(partido => {

          liveContainer.appendChild(
            crearPartido(partido, "live")
          );

        });

      }


      /* =========================
         RESULTADOS
      ========================= */

      if (resultados.length === 0) {

        resultsContainer.innerHTML = `
          <div class="empty">
            No hay resultados disponibles.
          </div>
        `;

      } else {

        resultsContainer.innerHTML = "";

        resultados.forEach(partido => {

          resultsContainer.appendChild(
            crearPartido(partido, "finished")
          );

        });

      }


      /* =========================
         PRÓXIMOS
      ========================= */

      if (proximos.length === 0) {

        nextContainer.innerHTML = `
          <div class="empty">
            No hay partidos programados
            para las próximas 24 horas.
          </div>
        `;

      } else {

        nextContainer.innerHTML = "";

        proximos.forEach(partido => {

          nextContainer.appendChild(
            crearPartido(partido, "upcoming")
          );

        });

      }


      /* =========================
         ACTUALIZACIÓN
      ========================= */

      const ahora =
        new Date();

      document.getElementById("updated").textContent =
        "Actualizado: " +
        ahora.toLocaleTimeString(
          "es-VE",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );


    } catch (error) {

      console.error(error);

      liveContainer.innerHTML = `
        <div class="error">
          ❌ No se pudieron cargar los partidos.
          <br><br>
          Pulsa "Actualizar".
        </div>
      `;

      resultsContainer.innerHTML = "";
      nextContainer.innerHTML = "";

    }

  }


  /* =========================
     CREAR PARTIDO
  ========================= */

  function crearPartido(
    partido,
    tipo
  ) {

    const fixture =
      partido.fixture;

    const home =
      partido.teams.home;

    const away =
      partido.teams.away;

    const league =
      partido.league;


    const golesHome =
      partido.goals.home ?? 0;

    const golesAway =
      partido.goals.away ?? 0;


    let marcador = "";
    let estado = "";


    /* EN VIVO */

    if (tipo === "live") {

      marcador =
        `${golesHome} - ${golesAway}`;


      const minuto =
        fixture.status.elapsed;


      if (fixture.status.short === "HT") {

        estado =
          "🔴 DESCANSO";

      } else if (minuto) {

        estado =
          `🔴 EN VIVO ${minuto}'`;

      } else {

        estado =
          "🔴 EN VIVO";

      }

    }


    /* FINALIZADO */

    else if (tipo === "finished") {

      marcador =
        `${golesHome} - ${golesAway}`;


      if (
        fixture.status.short === "AET"
      ) {

        estado =
          "FINAL - PRÓRROGA";

      } else if (
        fixture.status.short === "PEN"
      ) {

        estado =
          "FINAL - PENALTIS";

      } else {

        estado =
          "FINAL";

      }

    }


    /* PRÓXIMO */

    else {

      const fecha =
        new Date(fixture.date);


      marcador =
        fecha.toLocaleTimeString(
          "es-VE",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      estado =
        fecha.toLocaleDateString(
          "es-VE",
          {
            day: "2-digit",
            month: "2-digit"
          }
        );

    }


    const card =
      document.createElement("div");


    card.className =
      "match";


    card.innerHTML = `

      <div class="league">
        ${escapeHTML(league.name)}
      </div>


      <div class="teams">


        <div class="team">

          ${
            home.logo
              ? `
                <img
                  src="${escapeHTML(home.logo)}"
                  alt=""
                >
              `
              : ""
          }

          ${escapeHTML(home.name)}

        </div>


        <div class="score">

          ${marcador}

          <div class="status ${tipo}">

            ${escapeHTML(estado)}

          </div>

        </div>


        <div class="team">

          ${
            away.logo
              ? `
                <img
                  src="${escapeHTML(away.logo)}"
                  alt=""
                >
              `
              : ""
          }

          ${escapeHTML(away.name)}

        </div>


      </div>

    `;


    return card;

  }


  /* =========================
     SEGURIDAD
  ========================= */

  function escapeHTML(texto) {

    return String(texto)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =========================
     INICIAR
  ========================= */

  cargarPartidos();


  /* =========================
     ACTUALIZAR CADA 30 SEGUNDOS
  ========================= */

  setInterval(
    cargarPartidos,
    30000
  );

</script></body>
</html>
