<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOGER ATENCIO SPORT</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#07140d;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#0b2417;
padding:18px 10px;
text-align:center;
border-bottom:1px solid #1c4d31;
position:sticky;
top:0;
z-index:20;
}

header h1{
margin:0 0 6px;
font-size:23px;
}

header p{
margin:0;
color:#55ff91;
font-weight:bold;
font-size:13px;
}

main{
max-width:750px;
margin:auto;
padding:12px;
}

.estado{
background:#0b2417;
border:1px solid #1c4d31;
border-radius:10px;
padding:12px;
text-align:center;
margin-bottom:12px;
}

#estado{
color:#55ff91;
font-weight:bold;
}

.actualizando{
color:#999;
font-size:12px;
margin-top:5px;
}

.error{
background:#351010;
color:#ffaaaa;
padding:12px;
border-radius:8px;
margin-bottom:12px;
display:none;
}

/* CAJAS PRINCIPALES */

.principal{
background:#0b2417;
border:1px solid #1c4d31;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
}

.principal summary{
padding:15px;
cursor:pointer;
font-size:17px;
font-weight:bold;
list-style:none;
}

.principal summary::-webkit-details-marker{
display:none;
}

.principal summary:after{
content:"＋";
float:right;
color:#55ff91;
}

.principal[open] > summary:after{
content:"−";
}

.contador{
float:none;
display:inline-block;
background:#174c2d;
color:#55ff91;
padding:3px 8px;
border-radius:20px;
font-size:12px;
margin-left:5px;
}

.contenido-principal{
padding:5px;
}

/* PAIS */

.pais{
margin:6px 0;
border:1px solid #245437;
border-radius:8px;
overflow:hidden;
background:#091c11;
}

.pais summary{
padding:13px;
cursor:pointer;
list-style:none;
font-weight:bold;
font-size:15px;
}

.pais summary::-webkit-details-marker{
display:none;
}

.pais summary:after{
content:"＋";
float:right;
color:#55ff91;
}

.pais[open] > summary:after{
content:"−";
}

/* LIGA */

.liga{
margin:5px;
border:1px solid #1c4d31;
border-radius:7px;
overflow:hidden;
background:#0b2417;
}

.liga summary{
padding:11px;
cursor:pointer;
list-style:none;
color:#55ff91;
font-weight:bold;
font-size:14px;
}

.liga summary::-webkit-details-marker{
display:none;
}

.liga summary:after{
content:"＋";
float:right;
color:#888;
}

.liga[open] > summary:after{
content:"−";
}

.partidos{
padding:6px;
}

/* PARTIDO */

.partido{
background:#07140d;
border:1px solid #1c4d31;
border-radius:8px;
padding:12px;
margin-bottom:6px;
}

.equipos{
display:flex;
align-items:center;
justify-content:space-between;
gap:5px;
font-weight:bold;
font-size:14px;
}

.equipo{
width:40%;
text-align:center;
line-height:18px;
}

.resultado{
width:20%;
text-align:center;
color:#55ff91;
font-size:16px;
font-weight:bold;
}

.hora{
text-align:center;
color:#aaa;
