<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YOGER ATENCIO SPORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07140f;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #063d24, #0a6b3d);
      padding: 18px 12px;
      text-align: center;
      border-bottom: 2px solid #18b968;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    header p {
      margin: 6px 0 0;
      color: #b8ffd9;
      font-size: 13px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      background: #06110c;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .tab {
      flex: 1;
      border: 1px solid #17663e;
      background: #0b2117;
      color: #bfffdc;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #12a95d;
      color: white;
      border-color: #27e27e;
    }

    .status {
      margin: 10px;
      padding: 10px;
      background: #0b2117;
      border: 1px solid #17663e;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
      color: #bfffdc;
    }

    .content {
      padding: 0 10px 30px;
    }

    .country {
      margin-top: 12px;
      border: 1px solid #145c38;
      border-radius: 12px;
      overflow: hidden;
      background: #091b13;
    }

    .country-title {
      padding: 13px;
      background: linear-gradient(90deg, #0c4429, #0b2c1c);
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .country-title span:last-child {
      color: #55e694;
      font-size: 18px;
    }

    .country-body {
      display: none;
      padding: 7px;
    }

    .country.open .country-body {
      display: block;
    }

    .league {
      margin: 7px 0;
      border: 1px solid #123e29;
      border-radius: 10px;
      overflow: hidden;
      background: #07150f;
    }

    .league-title {
      padding: 11px;
      background: #0b291a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .league-title small {
      color: #70eaa1;
      font-weight: normal;
    }

    .league-body {
      display: none;
      padding: 6px;
    }

    .league.open .league-body {
      display: block;
    }

    .match {
      background: #0b2117;
      border: 1px solid #123e29;
      border-radius: 10px;
      padding: 10px;
      margin: 6px 0;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .match-time {
      color: #6ff0a2;
      font-size: 11px;
      font-weight: bold;
    }

    .live {
      color: #ff6565;
      font-weight: 900;
      font-size: 11px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 55px 1fr;
      align-items: center;
      gap: 5px;
    }

    .team {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }

    .team img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
      margin: 0 auto 5px;
    }

    .score {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
    }

    .status-match {
      margin-top: 7px;
      text-align: center;
      color: #8eb7a1;
      font-size: 10px;
    }

    .prediction-btn {
      width: 100%;
      margin-top: 9px;
      padding: 9px;
      border: 1px solid #21c96e;
      border-radius: 8px;
      background: #0d4b2b;
      color: white;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }

    .prediction-btn:hover {
      background: #126638;
    }

    .prediction-btn.loading {
      opacity: 0.6;
    }

    .prediction {
      display: none;
      margin-top: 9px;
      padding: 9px;
      background: #06130d;
      border: 1px solid #155b37;
      border-radius: 8px;
    }

    .prediction.show {
      display: block;
    }

    .prediction-title {
      text-align: center;
      color: #70f0a4;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .prediction-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .prediction-item {
      background: #0b2117;
      border-radius: 7px;
      padding: 7px;
      text-align: center;
      border: 1px solid #123e29;
    }

    .prediction-label {
      display: block;
      font-size: 10px;
      color: #9bc4ad;
      margin-bottom: 3px;
    }

    .prediction-value {
      font-size: 15px;
      font-weight: 900;
    }

    .green {
      color: #43ed8a;
    }

    .yellow {
      color: #ffd75a;
    }

    .red {
      color: #ff6565;
    }

    .prediction-error {
      color: #ff7777;
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    .empty {
      padding: 25px 10px;
      text-align: center;
      color: #8aa897;
      font-size: 13px;
    }

    .loading-main {
      padding: 30px;
      text-align: center;
      color: #7cf2a8;
    }

    @media (max-width: 400px) {
      header h1 {
        font-size: 21px;
      }

      .team {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="tabs">
  <button class="tab active" id="tab-live" onclick="cambiarSeccion('live')">
    🔴 EN VIVO
  </button>

  <button class="tab" id="tab-today" onclick="cambiarSeccion('today')">
    📅 HOY
  </button>

  <button class="tab" id="tab-next" onclick="cambiarSeccion('next')">
    ⏭️ PRÓXIMOS
  </button>
</div>

<div class="status" id="apiStatus">
  Cargando partidos...
</div>

<div class="content" id="content">
  <div class="loading-main">
    ⚽ Cargando partidos...
  </div>
</div>

<script>
  let datos = null;
  let seccionActual = "live";

  /*
  ============================================================
  LIGAS CON PREDICCIONES
  ============================================================
  */

  const ligasPrediccion = [
    "La Liga",
    "Copa del Rey",

    "Premier League",
    "Championship",
    "FA Cup",

    "Serie A",

    "Bundesliga",
    "2. Bundesliga",

    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Europa Conference League",

    "Serie A",
    "Brasileirão",
    "Copa Libertadores",
    "Copa Sudamericana",

    "Scottish Premiership",
    "Belgian Pro League",
    "Superliga",
    "Eliteserien",
    "Super League"
  ];

  /*
  ============================================================
  ORDEN DE PAÍSES
  ============================================================
  */

  const ordenPaises = [
    "España",
    "England",
    "Inglaterra",
    "Italy",
    "Italia",
    "Germany",
    "Alemania",
    "France",
    "Francia",
    "Europe",
    "Europa",
    "Brazil",
    "Brasil",
    "Argentina",
    "Scotland",
    "Escocia",
    "Belgium",
    "Bélgica",
    "Denmark",
    "Dinamarca",
    "Norway",
    "Noruega",
    "Switzerland",
    "Suiza"
  ];

  /*
  ============================================================
  CARGAR API
  ============================================================
  */

  async function cargarPartidos() {
    try {
      const respuesta = await fetch(
        "/api/football?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!respuesta.ok) {
        throw new Error(
          "Error HTTP " + respuesta.status
        );
      }

      datos = await respuesta.json();

      if (!datos.success) {
        throw new Error(
          datos.error || "Error de API"
        );
      }

      actualizarEstado();
      mostrarSeccion();

    } catch (error) {

      document.getElementById("apiStatus").innerHTML =
        "❌ Error cargando partidos";

      document.getElementById("content").innerHTML =
        `<div class="empty">
          No se pudieron cargar los partidos.<br><br>
          ${escapeHTML(error.message)}
        </div>`;
    }
  }

  /*
  ============================================================
  ESTADO API
  ============================================================
  */

  function actualizarEstado() {

    const live =
      Number(datos.cantidadEnVivo || 0);

    const hoy =
      Number(datos.cantidadHoy || 0);

    const manana =
      Number(datos.cantidadManana || 0);

    document.getElementById("apiStatus").innerHTML =
      `🟢 API ACTIVA · 🔴 ${live} EN VIVO · 📅 ${hoy} HOY · ⏭️ ${manana} PRÓXIMOS`;
  }

  /*
  ============================================================
  CAMBIAR SECCIÓN
  ============================================================
  */

  function cambiarSeccion(seccion) {

    seccionActual = seccion;

    document
      .querySelectorAll(".tab")
      .forEach(tab => {
        tab.classList.remove("active");
      });

    if (seccion === "live") {
      document
        .getElementById("tab-live")
        .classList.add("active");
    }

    if (seccion === "today") {
      document
        .getElementById("tab-today")
        .classList.add("active");
    }

    if (seccion === "next") {
      document
        .getElementById("tab-next")
        .classList.add("active");
    }

    mostrarSeccion();
  }

  /*
  ============================================================
  OBTENER PARTIDOS
  ============================================================
  */

  function obtenerPartidos() {

    if (!datos) return [];

    if (seccionActual === "live") {
      return Array.isArray(datos.enVivo)
        ? datos.enVivo
        : [];
    }

    if (seccionActual === "today") {
      return Array.isArray(datos.partidosHoy)
        ? datos.partidosHoy
        : [];
    }

    if (seccionActual === "next") {
      return Array.isArray(datos.partidosManana)
        ? datos.partidosManana
        : [];
    }

    return [];
  }

  /*
  ============================================================
  MOSTRAR SECCIÓN
  ============================================================
  */

  function mostrarSeccion() {

    const partidos =
      obtenerPartidos();

    const content =
      document.getElementById("content");

    if (!partidos.length) {
      content.innerHTML =
        `<div class="empty">
          ⚽ No hay partidos disponibles en esta sección.
        </div>`;
      return;
    }

    const agrupados =
      agruparPartidos(partidos);

    content.innerHTML = "";

    const paises =
      Object.keys(agrupados).sort(
        compararPaises
      );

    paises.forEach((pais, indicePais) => {

      const country =
        document.createElement("div");

      country.className =
        "country" +
        (indicePais === 0 ? " open" : "");

      const countryTitle =
        document.createElement("div");

      countryTitle.className =
        "country-title";

      countryTitle.innerHTML = `
        <span>🌎 ${escapeHTML(pais)}
          <small style="color:#75d99d;">
            (${contarPartidosPais(agrupados[pais])})
          </small>
        </span>
        <span>⌄</span>
      `;

      countryTitle.onclick = () => {
        country.classList.toggle("open");
      };

      const countryBody =
        document.createElement("div");

      countryBody.className =
        "country-body";

      const ligas =
        Object.keys(
          agrupados[pais]
        ).sort(
          compararLigas
        );

      ligas.forEach(
        (liga, indiceLiga) => {

          const league =
            document.createElement("div");

          league.className =
            "league" +
            (
              indicePais === 0 &&
              indiceLiga === 0
                ? " open"
                : ""
            );

          const leagueTitle =
            document.createElement("div");

          leagueTitle.className =
            "league-title";

          leagueTitle.innerHTML = `
            <span>
              ⚽ ${escapeHTML(liga)}
              <small>
                (${agrupados[pais][liga].length})
              </small>
            </span>
            <span>⌄</span>
          `;

          leagueTitle.onclick = () => {
            league.classList.toggle("open");
          };

          const leagueBody =
            document.createElement("div");

          leagueBody.className =
            "league-body";

          agrupados[pais][liga]
            .sort(ordenPartidos)
            .forEach(partido => {

              leagueBody.appendChild(
                crearPartido(partido)
              );

            });

          league.appendChild(
            leagueTitle
          );

          league.appendChild(
            leagueBody
          );

          countryBody.appendChild(
            league
          );
        }
      );

      country.appendChild(
        countryTitle
      );

      country.appendChild(
        countryBody
      );

      content.appendChild(
        country
      );
    });
  }

  /*
  ============================================================
  AGRUPAR
  ============================================================
  */

  function agruparPartidos(partidos) {

    const resultado = {};

    partidos.forEach(partido => {

      const pais =
        partido?.league?.country ||
        "Otros";

      const liga =
        partido?.league?.name ||
        "Liga desconocida";

      if (!resultado[pais]) {
        resultado[pais] = {};
      }

      if (!resultado[pais][liga]) {
        resultado[pais][liga] = [];
      }

      resultado[pais][liga].push(
        partido
      );
    });

    return resultado;
  }

  /*
  ============================================================
  CREAR PARTIDO
  ============================================================
  */

  function crearPartido(partido) {

    const div =
      document.createElement("div");

    div.className = "match";

    const fixture =
      partido.fixture || {};

    const teams =
      partido.teams || {};

    const goals =
      partido.goals || {};

    const home =
      teams.home || {};

    const away =
      teams.away || {};

    const status =
      fixture.status || {};

    const id =
      fixture.id;

    const esLive =
      status.short === "1H" ||
      status.short === "2H" ||
      status.short === "HT" ||
      status.short === "ET" ||
      status.short === "P";

    const hora =
      formatearHora(
        fixture.date
      );

    let marcador = "-";

    if (
      goals.home != null ||
      goals.away != null
    ) {
      marcador =
        `${goals.home ?? 0} - ${goals.away ?? 0}`;
    }

    const nombreLiga =
      partido?.league?.name ||
      "";

    const tienePrediccion =
      ligaTienePrediccion(
        nombreLiga
      );

    div.innerHTML = `

      <div class="match-top">

        <span class="match-time">
          ${escapeHTML(hora)}
        </span>

        ${
          esLive
            ? `<span class="live">
                🔴 EN VIVO
                ${status.elapsed != null
                  ? " " + status.elapsed + "'"
                  : ""}
              </span>`
            : `<span class="match-time">
                ${escapeHTML(
                  status.long || ""
                )}
              </span>`
        }

      </div>

      <div class="teams">

        <div class="team">

          ${
            home.logo
              ? `<img
                  src="${escapeAttr(home.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >`
              : ""
          }

          ${escapeHTML(
            home.name || "Local"
          )}

        </div>

        <div class="score">
          ${marcador}
        </div>

        <div class="team">

          ${
            away.logo
              ? `<img
                  src="${escapeAttr(away.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >`
              : ""
          }

          ${escapeHTML(
            away.name || "Visitante"
          )}

        </div>

      </div>

      <div class="status-match">
        ${esLive
          ? "Partido en juego"
          : escapeHTML(
              status.long || ""
            )}
      </div>

      ${
        tienePrediccion && id
          ? `
            <button
              class="prediction-btn"
              onclick="cargarPrediccion(
                ${Number(id)},
                this
              )"
            >
              🔮 VER PREDICCIÓN
            </button>

            <div
              class="prediction"
            ></div>
          `
          : ""
      }

    `;

    return div;
  }

  /*
  ============================================================
  PREDICCIÓN
  ============================================================
  */

  async function cargarPrediccion(
    fixtureId,
    boton
  ) {

    const contenedor =
      boton.parentElement
        .querySelector(
          ".prediction"
        );

    if (
      contenedor.classList.contains(
        "show"
      )
    ) {
      contenedor.classList.remove(
        "show"
      );
      return;
    }

    boton.disabled = true;
    boton.classList.add("loading");

    boton.textContent =
      "⏳ CARGANDO PREDICCIÓN...";

    contenedor.innerHTML =
      `<div class="prediction-title">
        Consultando predicción...
      </div>`;

    contenedor.classList.add("show");

    try {

      const respuesta =
        await fetch(
          `/api/football?prediction=${fixtureId}&t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

      const datosPrediccion =
        await respuesta.json();

      if (
        !respuesta.ok ||
        !datosPrediccion.success
      ) {
        throw new Error(
          datosPrediccion.error ||
          "No se pudo obtener la predicción"
        );
      }

      const lista =
        datosPrediccion.predictions;

      if (
        !Array.isArray(lista) ||
        !lista.length
      ) {
        throw new Error(
          "La API no devolvió predicción para este partido."
        );
      }

      const pred =
        lista[0];

      const p =
        pred.predictions || {};

      /*
      ----------------------------------------------------------
      1X2
      ----------------------------------------------------------
      */

      const homePercent =
        extraerPorcentaje(
          p.percent?.home
        );

      const drawPercent =
        extraerPorcentaje(
          p.percent?.draw
        );

      const awayPercent =
        extraerPorcentaje(
          p.percent?.away
        );

      /*
      ----------------------------------------------------------
      BTTS
      ----------------------------------------------------------
      */

      const btts =
        obtenerBTTS(p);

      /*
      ----------------------------------------------------------
      GOLES
      ----------------------------------------------------------
      */

      const over15 =
        obtenerOverUnder(
          p,
          "over 1.5"
        );

      const under35 =
        obtenerUnder(
          p,
          "under 3.5"
        );

      /*
      ----------------------------------------------------------
      MOSTRAR
      ----------------------------------------------------------
      */

      contenedor.innerHTML = `

        <div class="prediction-title">
          🔮 PREDICCIÓN API-FOOTBALL
        </div>

        <div class="prediction-grid">

          ${crearItem(
