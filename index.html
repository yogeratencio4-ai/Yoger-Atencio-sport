<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOGER ATENCIO SPORT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#06150f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(135deg,#073d24,#0b6b3d);
  padding:20px 14px;
  text-align:center;
  border-bottom:2px solid #16c172;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:900;
}

header p{
  margin:6px 0 0;
  color:#b8ffd8;
  font-size:13px;
  font-weight:bold;
}

.contenedor{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

.estado-api{
  text-align:center;
  padding:9px;
  margin-bottom:12px;
  border-radius:10px;
  background:#0b2519;
  color:#9fffc3;
  font-size:12px;
}

.seccion{
  margin-bottom:18px;
}

.seccion-titulo{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b301e;
  border:1px solid #145d38;
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:10px;
  font-size:18px;
  font-weight:900;
}

.contador{
  background:#16c172;
  color:#02150c;
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
}

.pais{
  margin:10px 0;
  border:1px solid #12452c;
  border-radius:12px;
  overflow:hidden;
  background:#081d13;
}

.pais-titulo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  cursor:pointer;
  background:linear-gradient(90deg,#0b3822,#0a2819);
  font-weight:900;
}

.pais-titulo span:last-child{
  color:#67e8a5;
}

.pais-contenido{
  display:none;
  padding:7px;
}

.pais.abierto .pais-contenido{
  display:block;
}

.liga{
  margin:8px 0;
  border:1px solid #153d29;
  border-radius:10px;
  overflow:hidden;
}

.liga-titulo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px;
  background:#0c2518;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.liga-titulo .flecha{
  color:#54e79a;
  font-size:12px;
}

.liga-contenido{
  display:none;
  padding:6px;
}

.liga.abierta .liga-contenido{
  display:block;
}

.partido{
  background:#0a2116;
  border:1px solid #164a30;
  border-radius:10px;
  padding:12px;
  margin:7px 0;
}

.partido:hover{
  border-color:#1bd477;
}

.info-partido{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:#8dc9a8;
  margin-bottom:10px;
}

.hora{
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.equipos{
  text-align:center;
  font-size:16px;
  font-weight:900;
  line-height:1.5;
}

.vs{
  color:#58d894;
  font-size:11px;
  margin:2px 0;
}

.marcador{
  text-align:center;
  margin-top:4px;
  font-size:22px;
  font-weight:900;
}

.en-vivo{
  display:inline-block;
  background:#d91616;
  color:#fff;
  padding:4px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.boton-pred{
  width:100%;
  border:0;
  margin-top:11px;
  padding:11px;
  border-radius:9px;
  background:linear-gradient(90deg,#087a43,#13b968);
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.boton-pred:active{
  transform:scale(.98);
}

.prediccion{
  display:none;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#05130c;
  border:1px solid #17613a;
}

.prediccion.visible{
  display:block;
}

.pred-titulo{
  text-align:center;
  color:#72efa9;
  font-weight:900;
  margin-bottom:10px;
}

.grid-pred{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.pred-box{
  background:#0b2518;
  border-radius:8px;
  padding:9px 5px;
  text-align:center;
}

.pred-box small{
  display:block;
  color:#8ebca1;
  font-size:10px;
}

.pred-box strong{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.pred-line{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #123722;
  font-size:13px;
}

.pred-line:last-child{
  border-bottom:0;
}

.consejo{
  margin-top:10px;
  padding:10px;
  background:#0d3220;
  border-radius:8px;
  color:#b8ffd4;
  font-size:12px;
  text-align:center;
  font-weight:bold;
}

.cargando{
  text-align:center;
  color:#8ff0b6;
  padding:10px;
  font-size:12px;
}

.sin-datos{
  text-align:center;
  padding:10px;
  color:#ffcc75;
  font-size:12px;
}

.vacio{
  text-align:center;
  padding:25px 10px;
  color:#7ea38d;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#557765;
  font-size:11px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="contenedor">

  <div id="estadoApi" class="estado-api">
    🔄 Cargando partidos...
  </div>

  <section class="seccion">
    <div class="seccion-titulo">
      <span>🔴 EN VIVO</span>
      <span id="contadorVivo" class="contador">0</span>
    </div>
    <div id="vivo"></div>
  </section>

  <section class="seccion">
    <div class="seccion-titulo">
      <span>📅 HOY</span>
      <span id="contadorHoy" class="contador">0</span>
    </div>
    <div id="hoy"></div>
  </section>

  <section class="seccion">
    <div class="seccion-titulo">
      <span>⏭️ PRÓXIMOS</span>
      <span id="contadorProximos" class="contador">0</span>
    </div>
    <div id="proximos"></div>
  </section>

</div>

<footer>
  YOGER ATENCIO SPORT ⚽
</footer>

<script>

const API_URL = "/api/football";
const PRED_URL = "/api/predictions";

let datosGlobales = null;


/* =====================================================
   UTILIDADES
===================================================== */

function texto(valor){
  return String(valor ?? "");
}

function esc(valor){
  return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function numero(valor){
  const n = Number(valor);
  return Number.isFinite(n) ? n : null;
}

function obtenerPartido(p){

  return {
    id: p?.fixture?.id ?? p?.id ?? null,

    local:
      p?.teams?.home?.name ??
      p?.home?.name ??
      p?.local ??
      "Local",

    visitante:
      p?.teams?.away?.name ??
      p?.away?.name ??
      p?.visitante ??
      "Visitante",

    fecha:
      p?.fixture?.date ??
      p?.date ??
      null,

    estado:
      p?.fixture?.status?.short ??
      p?.status?.short ??
      p?.status ??
      "",

    gl:
      p?.goals?.home ?? null,

    gv:
      p?.goals?.away ?? null,

    pais:
      p?.league?.country ??
      p?.country ??
      "Otros",

    liga:
      p?.league?.name ??
      p?.league ??
      "Otros"

  };
}


/* =====================================================
   FECHA
===================================================== */

function esEnVivo(p){
  const estados = [
    "1H","2H","HT","ET","BT",
    "P","LIVE","INT","2H",
    "Q1","Q2","Q3","Q4"
  ];

  return estados.includes(texto(p.estado).toUpperCase());
}

function formatoHora(fecha){

  if(!fecha) return "--:--";

  const d = new Date(fecha);

  if(isNaN(d.getTime())) return "--:--";

  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function esHoy(fecha){

  if(!fecha) return false;

  const d = new Date(fecha);
  const ahora = new Date();

  return (
    d.getFullYear() === ahora.getFullYear() &&
    d.getMonth() === ahora.getMonth() &&
    d.getDate() === ahora.getDate()
  );
}


/* =====================================================
   PREDICCIONES
===================================================== */

function cacheKey(p){

  return "yoger_pred_" +
    p.id + "_" +
    p.local + "_" +
    p.visitante;

}

function leerCache(p){

  try{

    const guardado =
      localStorage.getItem(cacheKey(p));

    if(!guardado) return null;

    const obj = JSON.parse(guardado);

    /*
     * Guardamos máximo 6 horas.
     */

    if(
      Date.now() - obj.timestamp >
      6 * 60 * 60 * 1000
    ){

      localStorage.removeItem(cacheKey(p));
      return null;

    }

    return obj.data;

  }catch(e){

    return null;

  }

}

function guardarCache(p,data){

  try{

    localStorage.setItem(
      cacheKey(p),
      JSON.stringify({
        timestamp:Date.now(),
        data:data
      })
    );

  }catch(e){}

}


/* =====================================================
   MOSTRAR PREDICCIÓN
===================================================== */

function porcentaje(valor){

  if(valor === null || valor === undefined || valor === ""){
    return "—";
  }

  const n = Number(
    String(valor).replace("%","").trim()
  );

  if(!Number.isFinite(n)){
    return esc(valor);
  }

  return n.toFixed(1) + "%";
}


function mostrarPrediccion(contenedor,data,p){

  if(!data){

    contenedor.innerHTML =
      `<div class="sin-datos">
        ⚠️ No hay predicción disponible para este partido.
      </div>`;

    return;

  }

  /*
   * Nuestro endpoint devuelve:
   *
   * predictions.unoXdos
   * predictions.btts
   * predictions.underOver
   * predictions.winner
   * predictions.advice
   * predictions.goles
   */

  const pred =
    data.predictions || {};

  const uno =
    pred.unoXdos || {};

  const btts =
    pred.btts || {};

  const goles =
    pred.goles || {};

  const local =
    uno.local ?? null;

  const empate =
    uno.empate ?? null;

  const visitante =
    uno.visitante ?? null;

  const ganador =
    pred.winner?.name ?? null;

  const advice =
    pred.advice ?? null;

  const underOver =
    pred.underOver ??
    pred.under_over ??
    null;

  const golesLocal =
    goles.local ?? null;

  const golesVisitante =
    goles.visitante ?? null;


  contenedor.innerHTML = `

    <div class="pred-titulo">
      🔮 PRONÓSTICO API-FOOTBALL
    </div>

    <div class="grid-pred">

      <div class="pred-box">
        <small>${esc(p.local)}</small>
        <strong>${porcentaje(local)}</strong>
      </div>

      <div class="pred-box">
        <small>EMPATE</small>
        <strong>${porcentaje(empate)}</strong>
      </div>

      <div class="pred-box">
        <small>${esc(p.visitante)}</small>
        <strong>${porcentaje(visitante)}</strong>
      </div>

    </div>

    <div class="pred-line">
      <span>🎯 BTTS Sí</span>
      <strong>${porcentaje(btts.si)}</strong>
    </div>

    <div class="pred-line">
      <span>🚫 BTTS No</span>
      <strong>${porcentaje(btts.no)}</strong>
    </div>

    <div class="pred-line">
      <span>⚽ Goles ${esc(p.local)}</span>
      <strong>${golesLocal !== null ? esc(golesLocal) : "—"}</strong>
    </div>

    <div class="pred-line">
      <span>⚽ Goles ${esc(p.visitante)}</span>
      <strong>${golesVisitante !== null ? esc(golesVisitante) : "—"}</strong>
    </div>

    <div class="pred-line">
      <span>📊 Under / Over</span>
      <strong>${underOver ? esc(underOver) : "—"}</strong>
    </div>

    <div class="pred-line">
      <span>🏆 Ganador</span>
      <strong>${ganador ? esc(ganador) : "—"}</strong>
    </div>

    ${
      advice
      ?
      `<div class="consejo">
        💡 ${esc(advice)}
      </div>`
      :
      ""
    }

  `;

}


/* =====================================================
   BOTÓN PREDICCIÓN
===================================================== */

async function cargarPrediccion(btn,p){

  const caja =
    document.getElementById(
      "pred-" + p.id
    );

  if(!caja) return;

  /*
   * Si ya está visible, cerrar.
   */

  if(caja.classList.contains("visible")){

    caja.classList.remove("visible");
    return;

  }

  caja.classList.add("visible");

  /*
   * Buscar primero en caché.
   */

  const cache =
    leerCache(p);

  if(cache){

    mostrarPrediccion(
      caja,
      cache,
      p
    );

    return;

  }

  caja.innerHTML =
    `<div class="cargando">
      🔄 Consultando pronóstico...
    </div>`;

  btn.disabled = true;

  try{

    const params =
      new URLSearchParams({

        fixtureId:String(p.id),

        home:p.local,

        away:p.visitante,

        league:p.liga,

        country:p.pais

      });

    const respuesta =
      await fetch(
        PRED_URL + "?" + params.toString()
      );

    const data =
      await respuesta.json();

    if(!respuesta.ok){

      throw new Error(
        data?.error
        ?
        JSON.stringify(data.error)
        :
        "Error HTTP " + respuesta.status
      );

    }

    /*
     * Guardamos solamente si realmente
     * hay una respuesta válida.
     */

    if(data?.disponible !== false){

      guardarCache(
        p,
        data
      );

    }

    mostrarPrediccion(
      caja,
      data,
      p
    );

  }catch(error){

    console.error(
      "Error predicción:",
      error
    );

    caja.innerHTML =
      `<div class="sin-datos">
        ⚠️ No se pudo cargar el pronóstico.<br>
        <small>${esc(error.message)}</small>
      </div>`;

  }

  btn.disabled = false;

}


/* =====================================================
   PARTIDO
===================================================== */

function crearPartido(p){

  const vivo =
    esEnVivo(p);

  const marcador =
    vivo &&
    p.gl !== null &&
    p.gv !== null
    ?
    `<div class="marcador">
      ${esc(p.gl)} - ${esc(p.gv)}
    </div>`
    :
    "";

  return `

    <div class="partido">

      <div class="info-partido">

        <span>
          ${
            vivo
            ?
            `<span class="en-vivo">🔴 EN VIVO</span>`
            :
            `📅 ${formatoHora(p.fecha)}`
          }
        </span>

        <span>
          ID: ${esc(p.id)}
        </span>

      </div>

      <div class="equipos">

        ${esc(p.local)}

        <div class="vs">VS</div>

        ${esc(p.visitante)}

      </div>

      ${marcador}

      ${
        p.id
        ?
        `
        <button
          class="boton-pred"
          onclick='cargarPrediccion(this, ${JSON.stringify(p)})'
        >
          🔮 PRONÓSTICOS
        </button>

        <div
          id="pred-${esc(p.id)}"
          class="prediccion"
        ></div>
        `
        :
        `
        <div class="sin-datos">
          Pronóstico no disponible
        </div>
        `
      }

    </div>

  `;

}


/* =====================================================
   AGRUPAR POR PAÍS → LIGA
===================================================== */

function agrupar(partidos){

  const paises = {};

  partidos.forEach(p=>{

    const pais =
      p.pais || "Otros";

    const liga =
      p.liga || "Otros";

    if(!paises[pais]){
      paises[pais] = {};
    }

    if(!paises[pais][liga]){
      paises[pais][liga] = [];
    }

    paises[pais][liga].push(p);

  });

  return paises;

}


/* =====================================================
   RENDER
===================================================== */

function renderSeccion(
  contenedorId,
  partidos,
  vacioTexto
){

  const contenedor =
    document.getElementById(
      contenedorId
    );

  if(!partidos.length){

    contenedor.innerHTML =
      `<div class="vacio">
        ${vacioTexto}
      </div>`;

    return;

  }

  const grupos =
    agrupar(partidos);

  let html = "";

  Object.keys(grupos)
    .sort((a,b)=>a.localeCompare(b))
    .forEach((pais,indexPais)=>{

      const ligas =
        grupos[pais];

      let ligasHtml = "";

      Object.keys(ligas)
        .sort((a,b)=>a.localeCompare(b))
        .forEach((liga,indexLiga)=>{

          const lista =
            ligas[liga];

          ligasHtml += `

            <div class="liga">

              <div
                class="liga-titulo"
                onclick="this.parentElement.classList.toggle('abierta')"
              >

                <span>
                  ⚽ ${esc(liga)}
                  <small>
                    (${lista.length})
                  </small>
                </span>

                <span class="flecha">
                  ▼
                </span>

              </div>

              <div class="liga-contenido">

                ${lista.map(crearPartido).join("")}

              </div>

            </div>

          `;

        });

      html += `

        <div class="pais">

          <div
            class="pais-titulo"
            onclick="this.parentElement.classList.toggle('abierto')"
          >

            <span>
              🌎 ${esc(pais)}
            </span>

            <span>
              ${Object.values(ligas)
                .reduce((total,arr)=>total+arr.length,0)}
              partidos
            </span>

          </div>

          <div class="pais-contenido">
            ${ligasHtml}
          </div>

        </div>

      `;

    });

  contenedor.innerHTML = html;

}


/* =====================================================
   CARGAR PARTIDOS
===================================================== */

async function cargarPartidos(){

  const estado =
    document.getElementById("estadoApi");

  try{

    estado.textContent =
      "🔄 Actualizando partidos...";

    const respuesta =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    const data =
      await respuesta.json();

    if(!respuesta.ok || data.success === false){

      throw new Error(
        data.error ||
        "No se pudieron cargar los partidos"
      );

    }

    datosGlobales = data;

    const todos =
      Array.isArray(data.partidos)
      ?
      data.partidos
      :
      [
        ...(data.enVivo || []),
        ...(data.partidosHoy || []),
        ...(data.partidosManana || [])
      ];

    const partidos =
      todos.map(obtenerPartido)
        .filter(p=>p.id !== null);

    const vivo =
      partidos.filter(esEnVivo);

    const hoy =
      partidos.filter(p=>
        !esEnVivo(p) &&
        esHoy(p.fecha)
      );

    const proximos =
      partidos.filter(p=>
        !esEnVivo(p) &&
        !esHoy(p.fecha)
      );

    document.getElementById(
      "contadorVivo"
    ).textContent = vivo.length;

    document.getElementById(
      "contadorHoy"
    ).textContent = hoy.length;

    document.getElementById(
      "contadorProximos"
    ).textContent = proximos.length;

    renderSeccion(
      "vivo",
      vivo,
      "No hay partidos en vivo en este momento."
    );

    renderSeccion(
      "hoy",
      hoy,
      "No hay partidos programados para hoy."
    );

    renderSeccion(
      "proximos",
      proximos,
      "No hay próximos partidos disponibles."
    );

    estado.textContent =
      `✅ ${partidos.length} partidos cargados`;

  }catch(error){

    console.error(error);

    estado.textContent =
      "❌ Error cargando los partidos";

    document.getElementById("vivo").innerHTML =
      `<div class="vacio">
        No se pudieron cargar los partidos.
      </div>`;

  }

}


/* =====================================================
   INICIO
===================================================== */

cargarPartidos();

/*
 * Actualizar cada 60 segundos.
 */

setInterval(
  cargarPartidos,
  60000
);

</script>

</body>
  </html>
