<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOGER ATENCIO SPORT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#06130d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  background:linear-gradient(135deg,#0b3d24,#062416);
  padding:18px 12px;
  text-align:center;
  border-bottom:2px solid #1e7545;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;color:#9ee7b9;font-size:12px;font-weight:bold}

.tabs{
  display:flex;
  gap:7px;
  padding:10px;
  position:sticky;
  top:0;
  z-index:20;
  background:#06130d;
}
.tabs button{
  flex:1;
  border:1px solid #286b47;
  background:#10251a;
  color:#fff;
  padding:11px 5px;
  border-radius:10px;
  font-weight:bold;
}
.tabs button.active{
  background:#17663b;
  border-color:#3dc978;
}

#estado{
  text-align:center;
  color:#8fa99a;
  font-size:12px;
  padding:5px 10px 10px;
}

.seccion{display:none;padding:0 9px 25px}
.seccion.active{display:block}

.pais{
  margin:12px 0 8px;
  border:1px solid #205f3e;
  border-radius:12px;
  overflow:hidden;
  background:#0b1c13;
}
.paisTitulo{
  width:100%;
  border:0;
  background:#123c27;
  color:#fff;
  padding:13px;
  text-align:left;
  font-size:15px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.liga{
  margin:8px;
  border:1px solid #244b36;
  border-radius:10px;
  overflow:hidden;
  background:#09150f;
}
.ligaTitulo{
  width:100%;
  border:0;
  background:#16291e;
  color:#d8ffe5;
  padding:11px;
  text-align:left;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.partidos{padding:7px}

.partido{
  background:#102119;
  border:1px solid #254635;
  border-radius:11px;
  margin-bottom:8px;
  padding:10px;
}

.cabeceraPartido{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.estadoPartido{
  font-size:10px;
  font-weight:900;
  color:#6cff9c;
}

.fecha{
  color:#aebdb4;
  font-size:11px;
  margin:5px 0 8px;
}

.equipos{
  text-align:center;
  font-size:16px;
  font-weight:900;
  line-height:1.5;
}

.vs{
  color:#63d98d;
  font-size:11px;
}

.marcador{
  text-align:center;
  font-size:20px;
  font-weight:1000;
  margin:4px;
}

.predBtn{
  width:100%;
  margin-top:9px;
  padding:11px;
  border:1px solid #d6a938;
  border-radius:9px;
  background:#3b2c08;
  color:#ffe28a;
  font-weight:1000;
}

.predPanel{
  display:none;
  margin-top:9px;
  border-top:1px solid #345444;
  padding-top:9px;
}

.predPanel.abierto{display:block}

.predTitulo{
  text-align:center;
  color:#ffd75e;
  font-weight:1000;
  margin-bottom:8px;
}

.mercado{
  background:#0a1710;
  border:1px solid #233d2d;
  border-radius:9px;
  padding:8px;
  margin:6px 0;
}

.mercadoTitulo{
  color:#bdeacb;
  font-size:11px;
  font-weight:bold;
  margin-bottom:6px;
}

.opciones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.opcion{
  background:#15251b;
  border-radius:7px;
  padding:8px;
  text-align:center;
  font-size:11px;
}

.porcentaje{
  display:block;
  font-size:17px;
  font-weight:1000;
  color:#72ffa1;
  margin-top:2px;
}

.fuentes{
  color:#899c91;
  font-size:10px;
  line-height:1.5;
  margin-top:8px;
}

.cargandoPred{
  text-align:center;
  color:#aaa;
  padding:10px;
  font-size:12px;
}

.sinDatos{
  text-align:center;
  color:#c5a85b;
  font-size:12px;
  padding:10px;
}

.otro{
  display:flex;
  justify-content:space-between;
  padding:7px;
  border-bottom:1px solid #1c3023;
  font-size:11px;
}
.otro:last-child{border-bottom:0}

.vacio{
  text-align:center;
  color:#82968a;
  padding:35px 10px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ YOGER ATENCIO SPORT</h1>
  <p>PARTIDOS DE FÚTBOL EN VIVO</p>
</header>

<div class="tabs">
  <button id="tabVivo" onclick="mostrarSeccion('vivo')" class="active">🔴 EN VIVO</button>
  <button id="tabHoy" onclick="mostrarSeccion('hoy')">📅 HOY</button>
  <button id="tabProx" onclick="mostrarSeccion('proximos')">⏭️ PRÓXIMOS</button>
</div>

<div id="estado">Cargando partidos...</div>

<section id="vivo" class="seccion active"></section>
<section id="hoy" class="seccion"></section>
<section id="proximos" class="seccion"></section>

<script>

let datos=[];
const cachePred={};

function escapar(t){
  return String(t ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function valor(obj,...claves){
  for(const c of claves){
    if(obj && obj[c] !== undefined && obj[c] !== null && obj[c] !== "")
      return obj[c];
  }
  return null;
}

function obtenerPartido(p){
  const fixture=valor(p,"fixture") || {};
  const partido=valor(p,"partido") || {};

  const teams=valor(p,"teams","equipos") || {};
  const home=valor(teams,"home","local") || {};
  const away=valor(teams,"away","visitante") || {};

  const league=valor(p,"league","liga") || {};

  const local=valor(home,"name","nombre") ||
              valor(p,"home","local") ||
              valor(partido,"local") ||
              "Local";

  const visitante=valor(away,"name","nombre") ||
                   valor(p,"away","visitante") ||
                   valor(partido,"visitante") ||
                   "Visitante";

  const fecha=valor(fixture,"date","fecha") ||
              valor(p,"date","fecha") ||
              valor(partido,"fecha");

  const status=valor(fixture,"status","estado") ||
               valor(p,"status","estado") ||
               {};

  const estado=typeof status==="object"
    ? valor(status,"short","codigo","long","nombre")
    : status;

  const goles=valor(p,"goals","goles","score","marcador","resultado") || {};

  const gl=valor(goles,"home","local","locales");
  const gv=valor(goles,"away","visitante","visitantes");

  return {
    id: valor(fixture,"id") || valor(p,"id") || (local+"-"+visitante+"-"+fecha),
    local,
    visitante,
    fecha,
    estado,
    gl,
    gv,
    pais: valor(league,"country","pais") || valor(p,"country","pais") || "Otros",
    liga: valor(league,"name","nombre") || valor(p,"leagueName","nombreLiga") || "Sin liga"
  };
}

function fechaBonita(fecha){
  if(!fecha) return "";
  const d=new Date(fecha);
  if(isNaN(d.getTime())) return escapar(fecha);

  return d.toLocaleString("es-ES",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function esEnVivo(p){
  const e=String(p.estado||"").toUpperCase();
  return ["1H","2H","HT","ET","P","LIVE","IN_PLAY","Q1","Q2","Q3","Q4"].includes(e)
    || e.includes("LIVE")
    || e.includes("EN VIVO");
}

function esHoy(p){
  if(esEnVivo(p)) return true;
  if(!p.fecha) return false;

  const d=new Date(p.fecha);
  const ahora=new Date();

  return d.getFullYear()===ahora.getFullYear()
    && d.getMonth()===ahora.getMonth()
    && d.getDate()===ahora.getDate();
}

function ordenarPartidos(a,b){
  return new Date(a.fecha||0)-new Date(b.fecha||0);
}

function crearEstructura(lista,tipo){

  const cont=document.getElementById(tipo);

  if(!lista.length){
    cont.innerHTML='<div class="vacio">⚽ No hay partidos disponibles.</div>';
    return;
  }

  const paises={};

  lista.forEach(p=>{
    if(!paises[p.pais]) paises[p.pais]={};
    if(!paises[p.pais][p.liga]) paises[p.pais][p.liga]=[];
    paises[p.pais][p.liga].push(p);
  });

  let html="";

  Object.keys(paises).sort().forEach(pais=>{

    html+=`
      <div class="pais">
        <button class="paisTitulo" onclick="abrirCerrar(this)">
          <span>🌎 ${escapar(pais)}</span>
          <span>▼</span>
        </button>
        <div class="contenidoPais">
    `;

    Object.keys(paises[pais]).sort().forEach(liga=>{

      const listaLiga=paises[pais][liga].sort(ordenarPartidos);

      html+=`
        <div class="liga">
          <button class="ligaTitulo" onclick="abrirCerrar(this)">
            <span>🏆 ${escapar(liga)}</span>
            <span>${listaLiga.length} ⚽ ▼</span>
          </button>

          <div class="partidos">
      `;

      listaLiga.forEach(p=>{
        html+=crearPartido(p);
      });

      html+=`
          </div>
        </div>
      `;
    });

    html+=`
        </div>
      </div>
    `;
  });

  cont.innerHTML=html;
}

function crearPartido(p){

  const vivo=esEnVivo(p);

  let estadoHTML=vivo
    ? `<span class="estadoPartido">🔴 EN VIVO</span>`
    : `<span class="estadoPartido">⚽ PARTIDO</span>`;

  let marcador="";

  if(p.gl!==null || p.gv!==null){
    marcador=`<div class="marcador">${p.gl ?? "-"} - ${p.gv ?? "-"}</div>`;
  }

  return `
    <div class="partido" id="partido-${encodeURIComponent(p.id)}">

      <div class="cabeceraPartido">
        ${estadoHTML}
        <span style="font-size:10px;color:#91a399">${escapar(p.id)}</span>
      </div>

      <div class="fecha">
        📅 ${fechaBonita(p.fecha)}
      </div>

      <div class="equipos">
        ${escapar(p.local)}
        <div class="vs">VS</div>
        ${escapar(p.visitante)}
      </div>

      ${marcador}

      <button class="predBtn"
        onclick="togglePrediccion(this,'${encodeURIComponent(p.local)}','${encodeURIComponent(p.visitante)}')">
        🔮 PRONÓSTICOS
      </button>

      <div class="predPanel"></div>

    </div>
  `;
}

function abrirCerrar(btn){

  const contenido=btn.nextElementSibling;
  const abierto=contenido.style.display!=="none";

  contenido.style.display=abierto?"none":"block";

  const flecha=btn.querySelector("span:last-child");
  if(flecha){
    const texto=flecha.textContent;
    flecha.textContent=texto.replace(abierto?"▼":"▲",abierto?"▲":"▼");
  }
}

function mostrarSeccion(tipo){

  document.querySelectorAll(".seccion").forEach(x=>x.classList.remove("active"));
  document.getElementById(tipo).classList.add("active");

  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));

  if(tipo==="vivo") document.getElementById("tabVivo").classList.add("active");
  if(tipo==="hoy") document.getElementById("tabHoy").classList.add("active");
  if(tipo==="proximos") document.getElementById("tabProx").classList.add("active");
}

function pct(v){
  if(v===null || v===undefined || isNaN(Number(v))) return "—";
  return Number(v).toFixed(1)+"%";
}

function mostrarOpcion(nombre,valorPct){
  return `
    <div class="opcion">
      ${escapar(nombre)}
      <span class="porcentaje">${pct(valorPct)}</span>
    </div>
  `;
}

function pintarPrediccion(panel,data){

  const pr=data?.predictions;

  if(!pr){
    panel.innerHTML='<div class="sinDatos">⚠️ No hay datos de pronóstico disponibles.</div>';
    return;
  }

  let html=`
    <div class="predTitulo">🔮 CONSENSO YOGER</div>
  `;

  if(pr.unoXdos){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">⚽ 1X2</div>
        <div class="opciones">
          ${mostrarOpcion("Local",pr.unoXdos.local)}
          ${mostrarOpcion("Empate",pr.unoXdos.empate)}
          ${mostrarOpcion("Visitante",pr.unoXdos.visitante)}
        </div>
      </div>
    `;
  }

  if(pr.goles){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">⚽ GOLES</div>
        <div class="opciones">
          ${mostrarOpcion("Más 1.5",pr.goles.mas15)}
          ${mostrarOpcion("Menos 3.5",pr.goles.menos35)}
        </div>
      </div>
    `;
  }

  if(pr.btts){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">⚽ BTTS</div>
        <div class="opciones">
          ${mostrarOpcion("Sí",pr.btts.si)}
          ${mostrarOpcion("No",pr.btts.no)}
        </div>
      </div>
    `;
  }

  if(pr.corners){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">⚽ CÓRNERS</div>
        <div class="opciones">
          ${mostrarOpcion("+6.5",pr.corners.mas65)}
          ${mostrarOpcion("-11.5",pr.corners.menos115)}
        </div>
      </div>
    `;
  }

  if(pr.tarjetas){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">🟨 TARJETAS</div>
        <div class="opciones">
          ${mostrarOpcion("+3.5",pr.tarjetas.mas35)}
          ${mostrarOpcion("-5.5",pr.tarjetas.menos55)}
        </div>
      </div>
    `;
  }

  if(Array.isArray(pr.otros) && pr.otros.length){
    html+=`
      <div class="mercado">
        <div class="mercadoTitulo">📊 OTROS MERCADOS</div>
    `;

    pr.otros.forEach(o=>{
      html+=`
        <div class="otro">
          <span>${escapar(o.mercado)} — ${escapar(o.opcion)}</span>
          <strong>${pct(o.porcentaje)}</strong>
        </div>
      `;
    });

    html+=`</div>`;
  }

  if(Array.isArray(pr.fuentes) && pr.fuentes.length){
    html+=`
      <div class="fuentes">
        📚 Fuentes: ${pr.fuentes.map(escapar).join(", ")}
      </div>
    `;
  }

  if(pr.metodologia){
    html+=`
      <div class="fuentes">
        🧠 ${escapar(pr.metodologia)}
      </div>
    `;
  }

  panel.innerHTML=html;
}

async function togglePrediccion(btn,home,away){

  const panel=btn.nextElementSibling;

  if(panel.classList.contains("abierto")){
    panel.classList.remove("abierto");
    return;
  }

  panel.classList.add("abierto");

  const local=decodeURIComponent(home);
  const visitante=decodeURIComponent(away);

  const clave=local+"|"+visitante;

  if(cachePred[clave]){
    pintarPrediccion(panel,cachePred[clave]);
    return;
  }

  panel.innerHTML='<div class="cargandoPred">🔄 Calculando consenso...</div>';

  try{

    const url="/api/predictions?home="
      +encodeURIComponent(local)
      +"&away="
      +encodeURIComponent(visitante);

    const respuesta=await fetch(url);

    if(!respuesta.ok)
      throw new Error("HTTP "+respuesta.status);

    const data=await respuesta.json();

    cachePred[clave]=data;

    pintarPrediccion(panel,data);

  }catch(error){

    panel.innerHTML=`
      <div class="sinDatos">
        ⚠️ No se pudo cargar el pronóstico.
      </div>
    `;
  }
}

async function cargarPartidos(){

  const estado=document.getElementById("estado");
  estado.textContent="🔄 Cargando partidos...";

  try{

    const respuesta=await fetch("/api/football?"+Date.now());

    if(!respuesta.ok)
      throw new Error("HTTP "+respuesta.status);

    const json=await respuesta.json();

    let todos=[];

    if(Array.isArray(json.partidos))
      todos=json.partidos;

    else{

      if(Array.isArray(json.enVivo))
        todos=todos.concat(json.enVivo);

      if(Array.isArray(json.partidosHoy))
        todos=todos.concat(json.partidosHoy);

      if(Array.isArray(json.partidosManana))
        todos=todos.concat(json.partidosManana);
    }

    const mapa=new Map();

    todos.forEach(x=>{
      const p=obtenerPartido(x);
      mapa.set(String(p.id),p);
    });

    datos=Array.from(mapa.values());

    const vivos=datos.filter(esEnVivo);

    const hoy=datos.filter(p=>esHoy(p) && !esEnVivo(p));

    const proximos=datos.filter(p=>!esHoy(p) && !esEnVivo(p));

    crearEstructura(vivos,"vivo");
    crearEstructura(hoy,"hoy");
    crearEstructura(proximos,"proximos");

    estado.textContent=
      `⚽ ${datos.length} partidos · 🔴 ${vivos.length} en vivo · 📅 ${hoy.length} hoy · ⏭️ ${proximos.length} próximos`;

  }catch(error){

    console.error(error);

    estado.textContent="⚠️ Error cargando los partidos.";

    ["vivo","hoy","proximos"].forEach(id=>{
      document.getElementById(id).innerHTML=
        '<div class="vacio">⚠️ No se pudieron cargar los partidos.</div>';
    });
  }
}

cargarPartidos();

setInterval(cargarPartidos,60000);

</script>

</body>
  </html>
