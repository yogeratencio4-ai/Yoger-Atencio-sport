<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoger Atencio SPORT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08110d;
  color:white;
}

header{
  background:#0d1f16;
  padding:18px 12px;
  text-align:center;
  border-bottom:2px solid #19d66b;
}

h1{margin:0;font-size:24px}

.subtitle{
  color:#19d66b;
  font-weight:bold;
  margin-top:6px;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

h2{margin:0;font-size:20px}

button{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#19d66b;
  color:#031108;
}

.match{
  background:#102019;
  border:1px solid #1d3a2a;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.league{
  color:#19d66b;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  text-align:center;
  gap:8px;
}

.team img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.team-name{
  font-weight:bold;
  margin-top:6px;
}

.vs{
  color:#aaa;
  font-weight:bold;
}

.score{
  font-size:21px;
  margin-top:6px;
}

.live{
  display:inline-block;
  background:#d60000;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.match-time{
  text-align:center;
  margin-top:12px;
  color:#ccc;
}

.watch{
  display:block;
  width:100%;
  margin-top:14px;
  background:#19d66b;
  color:#031108;
  font-size:15px;
}

#status{
  color:#aaa;
  font-size:14px;
  margin-bottom:12px;
}

.empty{
  background:#102019;
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:#aaa;
}

.notice{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#151515;
  border-radius:8px;
  color:#bbb;
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>

<header>
<h1>⚽ YOGER ATENCIO SPORT</h1>
<div class="subtitle">🔴 FÚTBOL EN VIVO</div>
</header>

<main>

<div class="topbar">
<h2>📺 Partidos de hoy</h2>
<button class="refresh" onclick="loadMatches()">🔄 Actualizar</button>
</div>

<div id="status">Cargando partidos...</div>
<div id="matches"></div>

</main>

<script>

const liveStatuses = new Set([
"1H","2H","HT","ET","BT","P","SUSP","INT","LIVE"
]);

function escapeHtml(value){
return String(value ?? "").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char]));
}

function formatTime(dateString){
const d=new Date(dateString);

return d.toLocaleString("es-ES",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
});
}

function watchMatch(home,away){

const query=encodeURIComponent(
home+" vs "+away+" transmisión oficial"
);

window.open(
"https://www.google.com/search?q="+query,
"_blank"
);

}

async function loadMatches(){

const status=document.getElementById("status");
const container=document.getElementById("matches");

status.textContent="Cargando partidos...";

try{

const res=await fetch("/api/football",{
cache:"no-store"
});

const data=await res.json();

if(!res.ok || data.errors?.token){
throw new Error(
data.errors?.token || "Error de la API"
);
}

const matches=Array.isArray(data.response)
?data.response
:[];

matches.sort((a,b)=>{

const aLive=liveStatuses.has(
a.fixture?.status?.short
);

const bLive=liveStatuses.has(
b.fixture?.status?.short
);

if(aLive!==bLive){
return bLive-aLive;
}

return new Date(a.fixture.date)-
new Date(b.fixture.date);

});

if(!matches.length){

container.innerHTML=
'<div class="empty">No hay partidos para hoy.</div>';

status.textContent="0 partidos encontrados";

return;
}

container.innerHTML=matches.map(m=>{

const f=m.fixture||{};
const l=m.league||{};
const h=m.teams?.home||{};
const a=m.teams?.away||{};

const hs=m.goals?.home;
const as=m.goals?.away;

const live=liveStatuses.has(
f.status?.short
);

return `

<div class="match">

<div class="league">
${escapeHtml(l.name)}
·
${escapeHtml(l.country)}
</div>

<div class="teams">

<div class="team">

<img
src="${escapeHtml(h.logo||"")}"
alt=""
>

<div class="team-name">
${escapeHtml(h.name)}
</div>

</div>

<div class="vs">

${
live
?
`
<span class="live">🔴 EN VIVO</span>

<div class="score">
${hs??0} - ${as??0}
</div>
`
:
"VS"
}

</div>

<div class="team">

<img
src="${escapeHtml(a.logo||"")}"
alt=""
>

<div class="team-name">
${escapeHtml(a.name)}
</div>

</div>

</div>

<div class="match-time">

${
live
?
escapeHtml(
f.status?.long||"En vivo"
)
:
"🕐 "+formatTime(f.date)
}

</div>

<button
class="watch"
onclick="watchMatch(
'${escapeHtml(h.name)}',
'${escapeHtml(a.name)}'
)"
>
▶️ VER EN VIVO
</button>

</div>

`;

}).join("");

status.textContent=
`${matches.length} partidos encontrados`;

}catch(error){

container.innerHTML=
'<div class="empty">No se pudieron cargar los partidos.</div>';

status.textContent=error.message;

}

}

loadMatches();

</script>

</body>
</html>
